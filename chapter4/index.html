<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 4 Fourier Series Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a bench instrument. Left rail of six lessons, right panel = one lesson: idea, live scope, check questions. */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --ink:#14212b; --muted:#5b6b75; --line:#d5dee3;
  --accent:#b5541c; --accent-soft:#f8e8dd; --keep:#1f8a4c; --drop:#b9c4ca; --warn:#c2412d; --trace:#14212b; --grid:#e7edf0;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1519; --panel:#142027; --ink:#e3ecef; --muted:#93a6af; --line:#24343c;
  --accent:#ff9d5c; --accent-soft:#3a2416; --keep:#4fd08a; --drop:#3a4a52; --warn:#ff7a62; --trace:#e3ecef; --grid:#1c2a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1519; --panel:#142027; --ink:#e3ecef; --muted:#93a6af; --line:#24343c;
  --accent:#ff9d5c; --accent-soft:#3a2416; --keep:#4fd08a; --drop:#3a4a52; --warn:#ff7a62; --trace:#e3ecef; --grid:#1c2a31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:var(--f-display);font-size:28px;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:68ch}
nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-radius:8px;border:1px solid transparent;color:var(--muted)}
nav button .n{font-family:var(--f-mono);font-size:12px;min-width:34px}
nav button:hover{color:var(--ink);background:var(--panel)}
nav button[aria-current="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-display);font-size:24px;margin:2px 0 0;text-wrap:balance}
.idea{max-width:70ch;margin:0}
.idea b{color:var(--ink)}
.rule{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-family:var(--f-mono);font-size:14px;overflow-x:auto}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:150px}
.ctl label{font-size:12.5px;color:var(--muted);font-weight:500}
.ctl output{font-family:var(--f-mono);font-size:14px}
input[type=range]{width:170px;accent-color:var(--accent)}
select,input[type=number]{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:120px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:600}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.scope figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;background:var(--bg);min-width:0}
.scope figcaption{font-size:12px;color:var(--muted);margin-bottom:4px}
canvas{width:100%;height:220px;display:block}
.readout{font-family:var(--f-mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;overflow-x:auto;white-space:pre-wrap}
.readout .ok{color:var(--keep);font-weight:600}.readout .bad{color:var(--warn);font-weight:600}
.try{font-size:14px;color:var(--muted);margin:0}
.try b{color:var(--ink)}
.quiz{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px}
.quiz h3{font-family:var(--f-display);font-size:16px;margin:0}
.q p{margin:0 0 8px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{all:unset;cursor:pointer;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg)}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--keep);color:var(--keep);font-weight:600}
.opts button.wrong{border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.fb{font-size:14px;margin-top:6px;color:var(--muted)}
.fb.right{color:var(--keep)}.fb.wrong{color:var(--warn)}
.navrow{display:flex;justify-content:space-between;gap:10px}
.navrow button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;border:1px solid var(--line);font-weight:500}
.navrow button.next{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.score{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.notes{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:4px 18px 14px}
.notes summary{cursor:pointer;font-family:var(--f-display);font-weight:700;padding:10px 0;color:var(--accent)}
.notes p,.notes li{max-width:74ch}.notes h4{font-family:var(--f-display);font-size:16px;margin:14px 0 4px}
.eq{font-family:var(--f-mono);font-size:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin:8px 0;overflow-x:auto;line-height:1.7}
.nt{border-collapse:collapse;margin:8px 0;font-size:14px;display:block;overflow-x:auto}.nt td,.nt th{border:1px solid var(--line);padding:4px 10px;text-align:left}.nt th{background:var(--accent-soft)}
.trap{background:color-mix(in srgb,var(--warn) 10%,transparent);border-left:3px solid var(--warn);border-radius:6px;padding:8px 12px;margin:10px 0;font-size:14px}
h4.more{border-top:1px dashed var(--line);padding-top:12px;margin-top:18px;color:var(--accent)}
.nx{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
code{font-family:var(--f-mono);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.summary{display:flex;flex-direction:column;gap:14px}
.kidea{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px}
.kidea p{margin:0;font-size:16.5px;line-height:1.5;max-width:76ch}
.tag{flex:none;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--panel);border-radius:4px;padding:3px 7px;margin-top:3px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.fbox,.howto,.cpic{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--bg)}
.summary h3,.tryh{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 8px}
.tryh{margin:6px 0 -4px;font-size:15px;border-top:1px solid var(--line);padding-top:16px}
.fbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fbox li{font-family:var(--f-mono);font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;overflow-x:auto}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.figs{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.cfig{margin:0;min-width:0}
.cfig svg{width:100%;height:auto;display:block;font-family:var(--f-body)}
.cfig figcaption{font-size:13px;color:var(--muted);margin-top:4px;max-width:60ch}
.notes.ex summary{color:var(--warn)}
.notes p{margin:8px 0}
.home{display:inline-block;margin-bottom:8px;color:var(--accent);text-decoration:none;font-weight:500}.home:hover{text-decoration:underline}
:root{color-scheme:light}body{margin:0}
</style>

</head><body>
<div class="wrap">
<header><a class="home" href="../">← All chapters</a>
  <h1>Chapter 4 Fourier Series Lab</h1>
  <p>Follows your typeset notes section by section (4.1 → 4.7). Each page starts with the big idea, formulas, a how-to and a concept picture, then the detailed notes, including Examples 4.1–4.9, then a live plot you control and check questions.</p>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(x,d=3)=>!isFinite(x)?"∞":(Math.abs(x)<1e-9?"0":(+x.toFixed(d)).toString());
const sq=x=>x*x;

/* ---------- canvas plotting ---------- */
function setup(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(10,r.width*dpr);c.height=Math.max(10,r.height*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return{g,w:r.width,h:r.height};}
function axes(c,xr,yr,o={}){
  const {g,w,h}=setup(c);const L=o.left??38,R=10,T=10,B=o.bottom??24;
  const X=x=>L+(x-xr[0])/(xr[1]-xr[0])*(w-L-R), Y=y=>h-B-(y-yr[0])/(yr[1]-yr[0])*(h-T-B);
  g.font='11px "JetBrains Mono",monospace';g.fillStyle=css('--muted');g.strokeStyle=css('--grid');g.lineWidth=1;
  (o.xt||[]).forEach(([v,l])=>{g.beginPath();g.moveTo(X(v),T);g.lineTo(X(v),h-B);g.stroke();g.textAlign='center';g.fillText(l,X(v),h-B+14);});
  (o.yt||[]).forEach(([v,l])=>{g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.textAlign='right';g.fillText(l,L-5,Y(v)+4);});
  g.strokeStyle=css('--muted');g.beginPath();g.moveTo(L,T);g.lineTo(L,h-B);g.lineTo(w-R,h-B);g.stroke();
  if(o.xl){g.textAlign='right';g.fillText(o.xl,w-R,h-B-5);}
  return{g,X,Y,w,h,L,R,T,B};
}
function line(P,f,x0,x1,col,lw=2,n=500,dash){const{g,X,Y}=P;g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));}g.stroke();g.setLineDash([]);}
function stick(P,x,y,col){const{g,X,Y}=P;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=3;g.beginPath();g.moveTo(X(x),Y(0));g.lineTo(X(x),Y(y));g.stroke();g.beginPath();g.arc(X(x),Y(y),4.5,0,7);g.fill();}
function label(P,x,y,t,col,align='left'){P.g.fillStyle=col;P.g.textAlign=align;P.g.font='12px "JetBrains Mono",monospace';P.g.fillText(t,P.X(x),P.Y(y));}

/* ---------- quiz helper ---------- */
const score={};
function quiz(id,items){
  const box=document.createElement('div');box.className='quiz';box.innerHTML='<h3>Check yourself</h3>';
  items.forEach((it,qi)=>{const q=document.createElement('div');q.className='q';q.innerHTML=`<p>${qi+1}. ${it.q}</p>`;const opts=document.createElement('div');opts.className='opts';const fb=document.createElement('div');fb.className='fb';
    it.o.forEach((t,oi)=>{const b=document.createElement('button');b.type='button';b.innerHTML=t;b.onclick=()=>{
      opts.querySelectorAll('button').forEach(x=>x.classList.remove('right','wrong'));
      const ok=oi===it.a;b.classList.add(ok?'right':'wrong');fb.className='fb '+(ok?'right':'wrong');
      fb.innerHTML=(ok?'Right. ':'Not quite. ')+it.e;score[id+qi]=ok;updScore();};opts.appendChild(b);});
    q.append(opts,fb);box.appendChild(q);});
  return box;
}
function updScore(){const v=Object.values(score);const el=$('#score');if(el)el.textContent=`${v.filter(Boolean).length} correct so far`;}

/* ---------- concept figures (static SVG) ---------- */
const COL={a:'var(--accent)',k:'var(--keep)',d:'var(--drop)',m:'var(--muted)',w:'var(--warn)',i:'var(--ink)'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function txt(x,y,s,o={}){return `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" fill="${COL[o.c||'i']}" font-size="${o.fs||13}" ${o.it?'font-style="italic"':''} font-weight="${o.b?600:400}">${esc(s)}</text>`;}
/* block diagram: items like 'x(t)' (signal label) or '[LPF]' (box). rows = array of item arrays */
function chain(items,o={}){
  const cells=items.map(s=>{const box=s[0]==='[';const t=box?s.slice(1,-1):s;return{box,t,w:Math.max(box?54:30,t.length*7.4+(box?22:6))};});
  const gap=30,H=o.h||70,y=H/2;let x=8,out='';
  cells.forEach((c,i)=>{
    if(c.box){out+=`<rect x="${x}" y="${y-19}" width="${c.w}" height="38" rx="7" fill="var(--accent-soft)" stroke="${COL.a}" stroke-width="1.5"/>`+txt(x+c.w/2,y+5,c.t,{b:1});}
    else out+=txt(x+c.w/2,y+5,c.t,{c:'a',b:1});
    x+=c.w;
    if(i<cells.length-1){out+=`<line x1="${x+3}" y1="${y}" x2="${x+gap-5}" y2="${y}" stroke="${COL.m}" stroke-width="1.6" marker-end="url(#ah)"/>`;x+=gap;}
  });
  if(o.note)out+=txt(x/2+4,H-4,o.note,{c:'m',fs:12});
  return svg(x+8,H,out);
}
function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" style="max-width:${w}px" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs>${inner}</svg>`;}
/* function / spectrum sketch */
function sk(o){
  const W=o.w||460,H=o.h||170,l=22,r=W-14,t=18,b=H-30;
  const [x0,x1]=o.xr,[y0,y1]=o.yr||[0,1.2];
  const X=x=>l+(x-x0)/(x1-x0)*(r-l),Y=y=>b-(y-y0)/(y1-y0)*(b-t);
  let s='';
  (o.items||[]).forEach(it=>{
    const c=COL[it.c||'a'];
    if(it.t==='band')s+=`<rect x="${X(it.x0)}" y="${t-6}" width="${X(it.x1)-X(it.x0)}" height="${b-t+6}" fill="${c}" opacity=".13"/>`+(it.lab?txt((X(it.x0)+X(it.x1))/2,t+4,it.lab,{c:it.c||'a',fs:11}):'');
  });
  s+=`<line x1="${l}" y1="${Y(0)}" x2="${r}" y2="${Y(0)}" stroke="${COL.m}" stroke-width="1.2" marker-end="url(#ah)"/>`;
  if(o.yaxis!==false&&x0<=0&&x1>=0)s+=`<line x1="${X(0)}" y1="${b+4}" x2="${X(0)}" y2="${t-8}" stroke="${COL.m}" stroke-width="1.2" marker-end="url(#ah)"/>`;
  s+=txt(r-2,Y(0)+18,o.xl||'ω',{c:'m',it:1,a:'end'});
  (o.ticks||[]).forEach(([x,lab])=>{s+=`<line x1="${X(x)}" y1="${Y(0)-3}" x2="${X(x)}" y2="${Y(0)+3}" stroke="${COL.m}"/>`+txt(X(x),Y(0)+16,lab,{c:'m',fs:11});});
  (o.items||[]).forEach(it=>{
    const c=COL[it.c||'a'],lw=it.lw||2.4,d=it.dash?`stroke-dasharray="5 4"`:'';
    if(it.t==='fn'){let p='';const n=it.n||300,a=it.x0??x0,e=it.x1??x1;for(let i=0;i<=n;i++){const x=a+(e-a)*i/n,v=it.f(x);p+=(i?'L':'M')+X(x).toFixed(1)+','+Y(Math.max(y0,Math.min(y1,v))).toFixed(1);}
      if(it.fill)s+=`<path d="${p}L${X(e)},${Y(0)}L${X(a)},${Y(0)}z" fill="${c}" opacity=".18"/>`;
      s+=`<path d="${p}" fill="none" stroke="${c}" stroke-width="${lw}" ${d}/>`;}
    if(it.t==='tri'){const p=`M${X(it.c0-it.w)},${Y(0)}L${X(it.c0)},${Y(it.h)}L${X(it.c0+it.w)},${Y(0)}`;s+=`<path d="${p}z" fill="${c}" opacity=".2"/><path d="${p}" fill="none" stroke="${c}" stroke-width="${lw}" ${d}/>`;}
    if(it.t==='rect'){s+=`<rect x="${X(it.c0-it.w)}" y="${Y(it.h)}" width="${X(it.c0+it.w)-X(it.c0-it.w)}" height="${Y(0)-Y(it.h)}" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="${lw}" ${d}/>`;}
    if(it.t==='imp'){s+=`<line x1="${X(it.x)}" y1="${Y(0)}" x2="${X(it.x)}" y2="${Y(it.h)}" stroke="${c}" stroke-width="2.4" marker-end="url(#ai)"/>`;}
    if(it.t==='bar'){s+=`<line x1="${X(it.x)}" y1="${Y(0)}" x2="${X(it.x)}" y2="${Y(it.h)}" stroke="${c}" stroke-width="3"/><circle cx="${X(it.x)}" cy="${Y(it.h)}" r="3.5" fill="${c}"/>`;}
    if(it.t==='hl'){s+=`<line x1="${X(it.x0??x0)}" y1="${Y(it.y)}" x2="${X(it.x1??x1)}" y2="${Y(it.y)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4"/>`;}
    if(it.t==='vl'){s+=`<line x1="${X(it.x)}" y1="${Y(it.y0??y0)}" x2="${X(it.x)}" y2="${Y(it.y1??y1)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4"/>`;}
    if(it.lab&&it.t!=='band'){const lx=it.lx??(it.x??it.c0??x0),ly=it.ly??((it.h??it.y??0)+(y1-y0)*0.08);s+=txt(X(lx),Y(ly)-2,it.lab,{c:it.c||'a',fs:12,b:1,a:it.la||'middle'});}
    if(it.t==='arrow'){s+=`<line x1="${X(it.x0)}" y1="${Y(it.y0)}" x2="${X(it.x1)}" y2="${Y(it.y1)}" stroke="${c}" stroke-width="1.6" marker-end="url(#ah)"/>`;}
  });
  (o.labels||[]).forEach(([x,y,s2,c,a])=>{s+=txt(X(x),Y(y),s2,{c:c||'i',fs:12,a:a||'middle'});});
  return svg(W,H,s);
}
const FIG=(...cells)=>`<div class="figs">${cells.map(([s,cap])=>`<figure class="cfig" style="flex:1 1 ${+(/viewBox="0 0 ([\d.]+)/.exec(s)||[0,300])[1]}px;max-width:${+(/viewBox="0 0 ([\d.]+)/.exec(s)||[0,300])[1]}px">${s}${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`).join('')}</div>`;
/* ---------- summary cards ---------- */
const sqw=t=>{const u=((t%2)+2)%2;return u<1?1:0;};
const sqN=(t,N)=>{let s=.5;for(let n=1;n<=N;n+=2)s+=2/(n*Math.PI)*Math.sin(n*Math.PI*t);return s;};
const KEY={
'4.1':{idea:'Any periodic signal is a sum of complex exponentials at multiples of one base frequency ω<sub>0</sub> = 2π/T<sub>0</sub>. The weight of each one is c<sub>n</sub>, found with one integral.',
 f:['x(t) = Σ c<sub>n</sub> e<sup>jnω<sub>0</sub>t</sup>,  ω<sub>0</sub> = 2π/T<sub>0</sub>','c<sub>n</sub> = (1/T<sub>0</sub>) ∫<sub>one period</sub> x(t) e<sup>−jnω<sub>0</sub>t</sup> dt','c<sub>0</sub> = average value of x (DC)','e<sup>−jnπ</sup> = (−1)<sup>n</sup>,  e<sup>−j2πn</sup> = 1'],
 steps:['Find T<sub>0</sub> and ω<sub>0</sub> = 2π/T<sub>0</sub>.','Do n = 0 separately: c<sub>0</sub> = average.','For n ≠ 0, integrate piece by piece over one period (split where x changes formula).','Simplify with e<sup>−jnπ</sup> = (−1)<sup>n</sup>; check even/odd n.','Square wave (Ex 4.1): c<sub>0</sub> = ½, c<sub>n</sub> = 1/(jπn) for odd n, 0 for even n.'],

'4.2':{idea:'Plot |c<sub>n</sub>| and ∠c<sub>n</sub> against frequency nω<sub>0</sub>: that\'s the line spectrum. For real signals, |c<sub>n</sub>| is even and ∠c<sub>n</sub> is odd.',

 steps:['Compute c<sub>n</sub> (4.1).','Magnitude |c<sub>n</sub>| and angle ∠c<sub>n</sub> for each n.','Draw a stick at each nω<sub>0</sub>; mirror for negative n.'],
 fig:()=>FIG([sk({xr:[-6,6],yr:[0,0.62],ticks:[[-5,'−5ω0'],[-3,'−3ω0'],[-1,'−ω0'],[1,'ω0'],[3,'3ω0'],[5,'5ω0']],items:[{t:'bar',x:0,h:.5,c:'k',lab:'½'},...[1,3,5].flatMap(n=>[{t:'bar',x:n,h:1/(n*Math.PI)},{t:'bar',x:-n,h:1/(n*Math.PI)}])]}),'|cn| of the square wave: sticks at harmonics, even in n, even harmonics are 0.'])},

 f:['x = a<sub>0</sub> + Σ a<sub>n</sub>cos(nω<sub>0</sub>t) + Σ b<sub>n</sub>sin(nω<sub>0</sub>t)','a<sub>0</sub> = c<sub>0</sub>,  a<sub>n</sub> = 2Re{c<sub>n</sub>},  b<sub>n</sub> = −2Im{c<sub>n</sub>}','polar: x = c<sub>0</sub> + Σ 2|c<sub>n</sub>| cos(nω<sub>0</sub>t + ∠c<sub>n</sub>)','reverse: A cos(ωt + θ) → c = (A/2)e<sup>jθ</sup> at +ω, conjugate at −ω'],
 steps:['Have c<sub>n</sub>? Amplitude of harmonic n is 2|c<sub>n</sub>|, phase is ∠c<sub>n</sub>.','Have a cosine sum? Each A cos(nω<sub>0</sub>t + θ) gives c<sub>±n</sub> = (A/2)e<sup>±jθ</sup>.','DC is c<sub>0</sub> itself (no factor 2).'],
 fig:()=>FIG([sk({xr:[-0.5,4.5],yr:[0,2.3],ticks:[[0,'0'],[1,'ω0'],[3,'3ω0']],items:[{t:'bar',x:0,h:.5,c:'k',lab:'c0'},{t:'bar',x:1,h:2/Math.PI,lab:'2|c1|'},{t:'bar',x:3,h:2/(3*Math.PI),lab:'2|c3|'}],labels:[[3,1.8,'one-sided: cosine amplitudes','m']]}),'One-sided picture: DC = c0, every other harmonic has amplitude 2|cn|.'])},

  [sk({xr:[0,4],yr:[-0.2,1.3],xl:'t',ticks:[[1,'1'],[2,'2']],items:[{t:'fn',f:sqw,c:'m',lw:1.4,n:800},{t:'fn',f:t=>{const u=((t%2)+2)%2,a=4,e=Math.exp(-a),y0=e/(1+e),y1=1-(1-y0)*e;return u<1?1-(1-y0)*Math.exp(-a*u):y1*Math.exp(-a*(u-1));},n:800}]}),'Square wave through an RC lowpass: high harmonics are cut, so the edges round off.'])},

 steps:['Write x as DC + cosines (or get c<sub>n</sub>).','Add DC² + each amplitude²/2.','"Keep 99% of power": add harmonics until the running sum ≥ 0.99P.','Example: 2 + 0.5cos(t+45°) + 2cos3t + 2cos(4t+120°) → 4 + 0.125 + 2 + 2 = 8.125.'],
 fig:()=>FIG([sk({xr:[-0.5,7.5],yr:[0,0.32],ticks:[[0,'DC'],[1,'1'],[3,'3'],[5,'5'],[7,'7']],items:[{t:'bar',x:0,h:.25,c:'k',lab:'¼'},...[1,3,5,7].map(n=>({t:'bar',x:n,h:2/(Math.PI*n)**2}))],labels:[[5,.25,'power per harmonic (square wave)','m']]}),'Power spectrum of the square wave: ¼ (DC) + 0.203 + 0.023 + … = ½.'])},

 fig:()=>FIG([(()=>{const o=60,b=180,S=22,P=(x,y)=>[o+x*S,b-y*S];let s=`<line x1="20" y1="${b}" x2="230" y2="${b}" stroke="var(--muted)"/><line x1="${o}" y1="${b+5}" x2="${o}" y2="10" stroke="var(--muted)"/>`;const ar=(x,y,c,l,dx=6,dy=-4)=>{const[p,q]=P(x,y);return `<line x1="${o}" y1="${b}" x2="${p}" y2="${q}" stroke="${c}" stroke-width="2.4" marker-end="url(#ai)"/>`+`<text x="${p+dx}" y="${q+dy}" font-size="12" fill="${c}" font-weight="600">${l}</text>`;};s+=ar(6,6,'var(--keep)','6φ1',-40,-6)+ar(1,1,'var(--accent)','φ1')+ar(-1,1,'var(--accent)','φ2',-22)+ar(7,5,'var(--ink)','x = [7,5]',6,10);const[p,q]=P(6,6),[u,v]=P(7,5);s+=`<line x1="${p}" y1="${q}" x2="${u}" y2="${v}" stroke="var(--warn)" stroke-dasharray="4 3" stroke-width="1.6"/>`;return svg(250,200,s);})(),'Project x onto each perpendicular axis: 6 along φ1, −1 along φ2. Fourier coefficients work the same way.'])}
};
const NOTES={
'4.1':`
<p><b>Motivation.</b> For an LTI system with FRF H(jω), complex exponentials are eigenfunctions: e<sup>jωt</sup> → H(jω)e<sup>jωt</sup>, and cos(ωt + φ) → |H(jω)|cos(ωt + φ + ∠H(jω)). By linearity, a <b>sum</b> of exponentials goes through term by term. Wouldn't it be nice to write any signal as such a sum? For <b>periodic</b> signals this can be done exactly: the Fourier Series.</p>
<p><b>Proposition 4.1 (Fourier Series).</b> A piecewise continuous periodic x(t) (real or complex) with period T<sub>0</sub> can be represented exactly as</p>
<div class="eq">x(t) = Σ<sub>n=−∞</sub><sup>+∞</sup> c<sub>n</sub> e<sup>jω<sub>0</sub>nt</sup>, &nbsp;&nbsp; ω<sub>0</sub> = 2π/T<sub>0</sub> &nbsp;&nbsp;&nbsp;(4.1)</div>
<ul><li>Both positive and negative frequencies are needed to represent real signals: cos ωt = (e<sup>jωt</sup> + e<sup>−jωt</sup>)/2.</li>
<li>ω<sub>0</sub> = 2π/T<sub>0</sub> is the <b>fundamental frequency</b>; ±nω<sub>0</sub> is the <b>n<sup>th</sup> harmonic</b>; the n = 0 term c<sub>0</sub> is the <b>DC term</b>.</li>
<li>Conditions: x(t) piecewise continuous. At a discontinuity the series converges to (x(t<sup>+</sup>) + x(t<sup>−</sup>))/2, the average of the left and right limits.</li></ul>
<h4>Finding the coefficients</h4>
<p>Multiply (4.1) by e<sup>−jmω<sub>0</sub>t</sup> and integrate over one period:</p>
<div class="eq">∫<sub>0</sub><sup>T<sub>0</sub></sup> x(t)e<sup>−jmω<sub>0</sub>t</sup>dt = Σ<sub>n</sub> c<sub>n</sub> ∫<sub>0</sub><sup>T<sub>0</sub></sup> e<sup>j(n−m)ω<sub>0</sub>t</sup>dt &nbsp;&nbsp;&nbsp;(4.2)</div>
<p>Case n = m: ∫ 1 dt = T<sub>0</sub>. Case n ≠ m: [e<sup>jω<sub>0</sub>(n−m)t</sup>/(jω<sub>0</sub>(n−m))]<sub>0</sub><sup>T<sub>0</sub></sup> = (e<sup>j2π(n−m)</sup> − 1)/(…) = 0. Only n = m survives:</p>
<div class="eq">c<sub>m</sub> = (1/T<sub>0</sub>) ∫<sub>0</sub><sup>T<sub>0</sub></sup> x(t) e<sup>−jω<sub>0</sub>mt</sup> dt &nbsp;&nbsp; for all m</div>
<p>The integral may be over <b>any</b> interval of length T<sub>0</sub>, since x(t)e<sup>−jmω<sub>0</sub>t</sup> is periodic with period T<sub>0</sub>.</p>
<h4>Example 4.1 — square wave</h4>
<p>x(t) = 1 on (0,1), 0 on (1,2), period T<sub>0</sub> = 2, so ω<sub>0</sub> = 2π/2 = π.</p>
<div class="eq">c<sub>n</sub> = (1/2)∫<sub>0</sub><sup>1</sup> e<sup>−jπnt</sup>dt<br>n = 0: c<sub>0</sub> = (1/2)∫<sub>0</sub><sup>1</sup>1 dt = 1/2<br>n ≠ 0: c<sub>n</sub> = (1/2)[e<sup>−jnπt</sup>/(−jnπ)]<sub>0</sub><sup>1</sup> = (e<sup>−jnπ</sup> − 1)/(−j2nπ)<br>&nbsp;&nbsp;n even: c<sub>n</sub> = 0 &nbsp;&nbsp;&nbsp; n odd: c<sub>n</sub> = (−1 − 1)/(−j2nπ) = 1/(jnπ)</div>
<p>Combining the ±n terms: x(t) = ½ + Σ<sub>n odd ≥ 1</sub> (2/(nπ)) sin(nπt) = ½ + (2/π)sin πt + (2/3π)sin 3πt + (2/5π)sin 5πt + …</p>
<p><b>4.1.1 Demo.</b> Adding more terms gives a better and better approximation; near the jumps an overshoot of about 9% remains no matter how many terms (Gibbs phenomenon).</p>`,

'4.2':`
<p>It is often useful to plot the <b>magnitude</b> |c<sub>n</sub>| and <b>phase</b> ∠c<sub>n</sub> of the Fourier coefficients against n (or nω<sub>0</sub>): the <b>line spectrum</b>.</p>
<p><b>Example 4.2</b> (square wave of Example 4.1):</p>
<div class="eq">|c<sub>n</sub>| = 1/2 (n = 0), 0 (n even), 1/(π|n|) (n odd)<br>∠c<sub>n</sub> = 0 (n even); n odd: ∠(1/(jπn)) = ∠(−j/(πn)) = −π/2 for n &gt; 0, +π/2 for n &lt; 0</div>
<p>Observe: |c<sub>n</sub>| is <b>even</b> in n and ∠c<sub>n</sub> is <b>odd</b>. Not a coincidence:</p>
<p><b>Proposition 4.2.</b> For a <b>real</b> signal x(t):</p>
<div class="eq">c<sub>−n</sub> = c<sub>n</sub>*, &nbsp;&nbsp; |c<sub>−n</sub>| = |c<sub>n</sub>|, &nbsp;&nbsp; ∠c<sub>−n</sub> = −∠c<sub>n</sub> &nbsp;&nbsp; for all n</div>
<p><i>Proof:</i> c<sub>n</sub>* = (1/T<sub>0</sub>)∫x*(t)e<sup>jω<sub>0</sub>nt</sup>dt = (1/T<sub>0</sub>)∫x(t)e<sup>−jω<sub>0</sub>(−n)t</sup>dt = c<sub>−n</sub>, since x* = x for real x.</p>`,

'4.3':`
<p>For real x(t) it is often useful to write it as a weighted sum of harmonically related cosines and sines:</p>
<div class="eq">x(t) = a<sub>0</sub> + Σ<sub>n=1</sub><sup>∞</sup> a<sub>n</sub>cos(nω<sub>0</sub>t) + Σ<sub>n=1</sub><sup>∞</sup> b<sub>n</sub>sin(nω<sub>0</sub>t) &nbsp;&nbsp;&nbsp;(4.3)</div>
<p><b>Relation to c<sub>n</sub>.</b> Split the complex series into n = 0, n &lt; 0 (substitute m = −n) and n &gt; 0, and use c<sub>−n</sub> = c<sub>n</sub>*:</p>
<div class="eq">x(t) = c<sub>0</sub> + Σ<sub>n≥1</sub>[(c<sub>n</sub>e<sup>jnω<sub>0</sub>t</sup>)* + c<sub>n</sub>e<sup>jnω<sub>0</sub>t</sup>] = c<sub>0</sub> + Σ<sub>n≥1</sub> 2Re{c<sub>n</sub>e<sup>jnω<sub>0</sub>t</sup>} &nbsp;&nbsp;(4.4)</div>
<p>(using α + α* = 2Re{α}). Writing c<sub>n</sub> = Re c<sub>n</sub> + j Im c<sub>n</sub> and Euler's formula:</p>
<div class="eq">a<sub>0</sub> = c<sub>0</sub> = (1/T<sub>0</sub>)∫x dt &nbsp;&nbsp; a<sub>n</sub> = 2Re{c<sub>n</sub>} = (2/T<sub>0</sub>)∫x(t)cos(nω<sub>0</sub>t)dt &nbsp;&nbsp; b<sub>n</sub> = −2Im{c<sub>n</sub>} = (2/T<sub>0</sub>)∫x(t)sin(nω<sub>0</sub>t)dt &nbsp;&nbsp;(4.5)</div>
<p><b>Example 4.3</b> (square wave): a<sub>0</sub> = ½, a<sub>n</sub> = 0, b<sub>n</sub> = −2Im{−j/(πn)} = 2/(πn) for n odd, 0 for n even. So x(t) = ½ + Σ<sub>odd</sub> (2/(πn)) sin(nπt).</p>
<h4>Third way: polar form</h4>
<p>Put c<sub>n</sub> = |c<sub>n</sub>|e<sup>j∠c<sub>n</sub></sup> into (4.4):</p>
<div class="eq">x(t) = c<sub>0</sub> + Σ<sub>n=1</sub><sup>∞</sup> 2|c<sub>n</sub>| cos(nω<sub>0</sub>t + ∠c<sub>n</sub>)</div>
<p>Only cosines of the harmonic frequencies ω<sub>0</sub>, 2ω<sub>0</sub>, 3ω<sub>0</sub>, … <b>Example 4.4</b>: the square wave is x(t) = ½ + Σ<sub>odd</sub> (2/(πn))cos(nω<sub>0</sub>t − π/2).</p>`,

'4.4':`
<p>Take a periodic x(t) = Σc<sub>n</sub>e<sup>jnω<sub>0</sub>t</sup> into a BIBO-stable LTI system with FRF H(jω). Each harmonic is an eigenfunction, so</p>
<div class="eq">y(t) = Σ<sub>n</sub> c<sub>n</sub>H(jnω<sub>0</sub>)e<sup>jnω<sub>0</sub>t</sup> = c<sub>0</sub>H(j0) + Σ<sub>n≥1</sub> 2|c<sub>n</sub>||H(jnω<sub>0</sub>)| cos(nω<sub>0</sub>t + ∠c<sub>n</sub> + ∠H(jnω<sub>0</sub>))</div>
<p>Each term is affected differently because H(jnω<sub>0</sub>) depends on the harmonic frequency. The output has the same period.</p>
<h4>Example 4.5 — square wave through an RC circuit</h4>
<div class="eq">H(jω) = (1/jωC)/(1/jωC + R) = 1/(1 + jωRC), &nbsp; |H| = 1/√(1+(RCω)²), &nbsp; ∠H = −tan<sup>−1</sup>(RCω)</div>
<p>A lowpass filter: |H| = 1/√2 at ω = 1/RC. The harmonics at nπ are attenuated more as n grows, so the output loses its sharp edges (exponential rise and fall). Larger RC ⇒ smoother output.</p>
<h4>Example 4.6 — differentiator</h4>
<p>y = dx/dt is LTI (an LCCDE). h(t) = δ′(t) is awkward, so use x = e<sup>jωt</sup> ⇒ y = jωe<sup>jωt</sup> ⇒ <b>H(jω) = jω</b>: |H| = |ω| (highpass), ∠H = π/2 for ω &gt; 0, −π/2 for ω &lt; 0. For periodic x: y = Σ c<sub>n</sub>(jnω<sub>0</sub>)e<sup>jnω<sub>0</sub>t</sup>, which matches differentiating the series term by term ✓.</p>
<h4>Example 4.7 — pure delay</h4>
<p>h(t) = δ(t − t<sub>0</sub>) ⇒ H(jω) = ∫δ(t−t<sub>0</sub>)e<sup>−jωt</sup>dt = e<sup>−jωt<sub>0</sub></sup> (Method A), or x = e<sup>jωt</sup> ⇒ y = e<sup>jω(t−t<sub>0</sub>)</sup> (Method B). All-pass: |H| = 1, ∠H = −ωt<sub>0</sub>. For periodic x: y = Σ c<sub>n</sub>e<sup>−jnω<sub>0</sub>t<sub>0</sub></sup>e<sup>jnω<sub>0</sub>t</sup> = x(t − t<sub>0</sub>) as expected.</p>`,

'4.5':`
<p>What is the average power of a periodic x(t) = Σc<sub>n</sub>e<sup>jnω<sub>0</sub>t</sup>?</p>
<div class="eq">P<sub>avg</sub> = (1/T<sub>0</sub>)∫<sub>0</sub><sup>T<sub>0</sub></sup>|x(t)|²dt = (1/T<sub>0</sub>)∫(Σ<sub>n</sub>c<sub>n</sub>e<sup>jnω<sub>0</sub>t</sup>)(Σ<sub>m</sub>c<sub>m</sub>*e<sup>−jmω<sub>0</sub>t</sup>)dt = (1/T<sub>0</sub>)Σ<sub>n</sub>Σ<sub>m</sub>c<sub>n</sub>c<sub>m</sub>*∫e<sup>j(n−m)ω<sub>0</sub>t</sup>dt</div>
<p>The integral is T<sub>0</sub> for n = m and 0 otherwise, so only the "diagonal" survives:</p>
<p><b>Proposition 4.3 (Parseval's theorem for Fourier Series).</b></p>
<div class="eq">P<sub>avg</sub> = Σ<sub>n=−∞</sub><sup>+∞</sup> |c<sub>n</sub>|² &nbsp;&nbsp;&nbsp;(4.6) &nbsp;&nbsp;&nbsp; real x: P<sub>avg</sub> = |c<sub>0</sub>|² + Σ<sub>n≥1</sub> 2|c<sub>n</sub>|² &nbsp;&nbsp;(4.7)</div>
<p>Each harmonic contributes |c<sub>n</sub>|² of power; for real x the ±n harmonics contribute equally. Compare with the polar form: the cosine 2|c<sub>n</sub>|cos(…) has power (2|c<sub>n</sub>|)²/2 = 2|c<sub>n</sub>|² (A cos → A²/2), and the DC term c<sub>0</sub> has power |c<sub>0</sub>|².</p>
<p><b>Example 4.8.</b> Approximating x by N terms, choose N so that 99% of the power is kept: |c<sub>0</sub>|² + Σ<sub>n=1</sub><sup>N</sup>2|c<sub>n</sub>|² ≥ 0.99(total power). A plot of |c<sub>n</sub>|² vs n (or nω<sub>0</sub>) is a <b>power spectrum</b>.</p>
<p><b>Example 4.9</b> (square wave). Time domain: P = (1/2)∫<sub>0</sub><sup>2</sup>|x|²dt = (1/2)∫<sub>0</sub><sup>1</sup>1 dt = ½ (4.8). Parseval: P = ¼ + Σ<sub>odd</sub> 2/(π²n²) (4.9). Setting them equal gives a nice series:</p>
<div class="eq">¼ + Σ<sub>n odd</sub> 2/(π²n²) = ½ &nbsp;⇔&nbsp; Σ<sub>n odd</sub> 1/n² = π²/8 &nbsp;&nbsp;&nbsp;(4.10)</div>`,

'4.6':`
<p><b>Vectors first.</b> In ℝ² any vector is a weighted sum of two coordinate vectors: x⃗ = c<sub>1</sub>φ⃗<sub>1</sub> + c<sub>2</sub>φ⃗<sub>2</sub>. E.g. φ⃗<sub>1</sub> = [2,1], φ⃗<sub>2</sub> = [1,1], x⃗ = [7,5] = 2φ⃗<sub>1</sub> + 3φ⃗<sub>2</sub>. To find c<sub>1</sub>, c<sub>2</sub>, project (dot product ⟨x⃗,y⃗⟩ = Σx<sub>i</sub>y<sub>i</sub>, length ‖x⃗‖ = √⟨x⃗,x⃗⟩):</p>
<div class="eq">⟨x⃗,φ⃗<sub>1</sub>⟩ = c<sub>1</sub>⟨φ⃗<sub>1</sub>,φ⃗<sub>1</sub>⟩ + c<sub>2</sub>⟨φ⃗<sub>2</sub>,φ⃗<sub>1</sub>⟩ ⇒ 19 = 5c<sub>1</sub> + 3c<sub>2</sub> &nbsp;(4.13) &nbsp;&nbsp; 12 = 3c<sub>1</sub> + 2c<sub>2</sub> &nbsp;(4.14) ⇒ c<sub>1</sub> = 2, c<sub>2</sub> = 3</div>
<p>In general you must solve an n×n linear system. <b>Orthogonal</b> coordinates (⟨φ⃗<sub>1</sub>,φ⃗<sub>2</sub>⟩ = 0, Def. 4.2) are easier: the cross term vanishes and</p>
<div class="eq">c<sub>i</sub> = ⟨x⃗,φ⃗<sub>i</sub>⟩ / ‖φ⃗<sub>i</sub>‖² &nbsp;&nbsp;&nbsp;(4.17)</div>
<p>E.g. φ⃗<sub>1</sub> = [1,1], φ⃗<sub>2</sub> = [−1,1]: c<sub>1</sub> = 12/2 = 6, c<sub>2</sub> = −2/2 = −1, so x⃗ = 6φ⃗<sub>1</sub> − φ⃗<sub>2</sub>.</p>
<h4>Signals as vectors</h4>
<p>Think of a periodic x(t) as a vector in an ∞-dimensional space with coordinate vectors φ<sub>n</sub>(t) = e<sup>jnω<sub>0</sub>t</sup> (4.18). <b>Definition 4.3:</b> inner product ⟨x,y⟩ = ∫<sub>0</sub><sup>T<sub>0</sub></sup>x(t)y*(t)dt (4.19), ‖x‖ = √(energy over a period) (4.20). The harmonics are orthogonal: ⟨φ<sub>n</sub>,φ<sub>m</sub>⟩ = 0 for n ≠ m (4.23–4.25), ‖φ<sub>n</sub>‖² = T<sub>0</sub> (4.26). So</p>
<div class="eq">c<sub>n</sub> = ⟨x,φ<sub>n</sub>⟩/‖φ<sub>n</sub>‖² = (1/T<sub>0</sub>)∫<sub>0</sub><sup>T<sub>0</sub></sup>x(t)e<sup>−jnω<sub>0</sub>t</sup>dt &nbsp;&nbsp;(4.27): exactly the Fourier coefficients!</div>
<p><b>4.7 Summary:</b> the Fourier series is a representation of a "vector" as a weighted sum of orthogonal "vectors".</p>
<h4>4.7.1 Approximation</h4>
<p>"Best" approximation x̂ = Σ<sub>i=1</sub><sup>N</sup>ĉ<sub>i</sub>φ<sub>i</sub> = the one minimizing the length of the error e⃗ = x⃗ − x̂. <b>Proposition 4.4:</b> it is the orthogonal projection, ĉ<sub>i</sub> = ⟨x⃗,φ⃗<sub>i</sub>⟩/‖φ⃗<sub>i</sub>‖² (4.28) (set ∂J/∂c<sub>i</sub> = 0 in J = Σc<sub>i</sub>²‖φ⃗<sub>i</sub>‖² − 2Σc<sub>i</sub>⟨x⃗,φ⃗<sub>i</sub>⟩, or complete the square).</p>
<p>For signals, measure closeness by the <b>integrated square error</b> ISE = ∫<sub>α</sub><sup>β</sup>|x(t) − Σĉ<sub>i</sub>φ<sub>i</sub>(t)|²dt (4.30–4.31). <b>Proposition 4.5:</b> ISE is minimized by ĉ<sub>i</sub> = ⟨x,φ<sub>i</sub>⟩/‖φ<sub>i</sub>‖² (4.32). For [0,T] and φ<sub>n</sub> = e<sup>jnω<sub>0</sub>t</sup> these are exactly the Fourier coefficients. <b>The best finite approximation (in ISE) is the truncated Fourier series.</b></p>`
};

<p>x = 2 on (0,1), 0 on (1,4), T<sub>0</sub> = 4, ω<sub>0</sub> = π/2.</p>

function coeffs(fn,T,N,M=4000){const w0=2*Math.PI/T,c={};for(let n=-N;n<=N;n++){let re=0,im=0;for(let i=0;i<M;i++){const t=(i+0.5)*T/M,v=fn(t);re+=v*Math.cos(n*w0*t);im-=v*Math.sin(n*w0*t);}c[n]=[re/M,im/M];}return c;}
const cabs=z=>Math.hypot(z[0],z[1]),cang=z=>Math.atan2(z[1],z[0]);
function synth(c,T,N,t){const w0=2*Math.PI/T;let s=0;for(let n=-N;n<=N;n++){const z=c[n];s+=z[0]*Math.cos(n*w0*t)-z[1]*Math.sin(n*w0*t);}return s;}
function cstr(z){const a=Math.abs(z[0])<5e-4?0:z[0],b=Math.abs(z[1])<5e-4?0:z[1];if(!b)return fmt(a,3);if(!a)return fmt(b,3)+'j';return `${fmt(a,3)} ${b<0?'−':'+'} ${fmt(Math.abs(b),3)}j`;}
function segs(el,id,opts,cb){el.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{el.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.v);});}

    Q.g.strokeStyle=css('--accent');Q.g.lineWidth=2.5;Q.g.beginPath();Q.g.moveTo(Q.X(0),Q.Y(0));Q.g.lineTo(Q.X(re),Q.Y(im));Q.g.stroke();Q.g.fillStyle=css('--accent');Q.g.beginPath();Q.g.arc(Q.X(re),Q.Y(im),5,0,7);Q.g.fill();
    label(Q,re,im+0.18,' c₁',css('--ink'));
    $('#r43').innerHTML=`c₁ = ${re} ${im<0?'−':'+'} ${Math.abs(im)}j      |c₁| = ${fmt(m,3)}      ∠c₁ = ${fmt(ph*180/Math.PI,1)}°\npolar:  x = ${c0} + ${fmt(2*m,3)}·cos(ω₀t ${ph<0?'−':'+'} ${fmt(Math.abs(ph*180/Math.PI),1)}°)\ntrig:   a₁ = 2Re c₁ = ${fmt(a,2)},  b₁ = −2Im c₁ = ${fmt(b,2)}   ⇒  x = ${c0} + ${fmt(a,2)}cos ω₀t + ${fmt(b,2)}sin ω₀t`;
  }
  ['#re43','#im43','#c043'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('c43',[
   {q:'c₀ = 3, c₁ = 1 + j, all others 0. The polar form is…',o:['3 + √2cos(ω₀t + π/4)','3 + 2√2cos(ω₀t + π/4)','3 + 2cos(ω₀t) + 2sin(ω₀t)','3 + √2cos(ω₀t − π/4)'],a:1,e:'|c₁| = √2, ∠c₁ = π/4, amplitude 2|c₁| = 2√2.'},
   {q:'Same c₁ = 1 + j. What is b₁?',o:['2','−2','1','−1'],a:1,e:'b₁ = −2Im c₁ = −2.'},
   {q:'Square wave: cₙ = −j/(πn) for odd n. Its trig form has…',o:['only cosines','only sines','both','no DC'],a:1,e:'cₙ purely imaginary ⇒ aₙ = 2Re cₙ = 0, bₙ = 2/(πn): only sines (plus DC ½).'}]));
}});

/* 4.4 */
L.push({t:'Periodic Signals through LTI Systems',s:'4.4',k:'4.4',build(el){
  el.innerHTML=`<div class="rule">y(t) = Σ cₙ H(jnω₀) e<sup>jnω₀t</sup>   — each harmonic is scaled by |H(jnω₀)| and shifted by ∠H(jnω₀)</div>
  <p class="try"><b>Try:</b> the square wave of Example 4.1 through the RC lowpass (Example 4.5). Increase RC and watch the edges round off. Switch to the delay (Example 4.7) or an ideal LPF.</p>
  <div class="controls">
    <div class="ctl"><label>System</label><div class="seg" id="s44"><button aria-pressed="true" data-v="rc">RC lowpass</button><button data-v="dly">Delay</button><button data-v="lpf">Ideal LPF</button></div></div>
    <div class="ctl"><label for="p44" id="p44l">RC</label><input id="p44" type="range" min="0.02" max="1.5" step="0.02" value="0.2"><output id="p44o"></output></div>
  </div>
  <div class="scope"><figure><figcaption>Input square wave (grey) and output y(t) (blue)</figcaption><canvas id="a44"></canvas></figure><figure><figcaption>|H(jω)| with the harmonics nπ marked</figcaption><canvas id="b44"></canvas></figure></div>
  <div class="readout" id="r44"></div>`;
  let sys='rc';segs(el,'s44',null,v=>{sys=v;const p=$('#p44');if(v==='rc'){p.min=0.02;p.max=1.5;p.step=0.02;p.value=0.2;$('#p44l').textContent='RC';}else if(v==='dly'){p.min=0;p.max=2;p.step=0.05;p.value=0.5;$('#p44l').textContent='delay t₀';}else{p.min=1;p.max=20;p.step=0.5;p.value=4;$('#p44l').textContent='cutoff ωc';}draw();});
  function H(w,p){if(sys==='rc')return[1/(1+sq(w*p)),-w*p/(1+sq(w*p))];if(sys==='dly')return[Math.cos(w*p),-Math.sin(w*p)];return Math.abs(w)<p?[1,0]:[0,0];}
  function draw(){
    const p=+$('#p44').value;$('#p44o').textContent=p;const w0=Math.PI,Nm=61;
    const cn=n=>n===0?[0.5,0]:(n%2?[0,-1/(n*Math.PI)]:[0,0]);
    const y=t=>{let s=0;for(let n=-Nm;n<=Nm;n++){const c=cn(n),h=H(n*w0,p),re=c[0]*h[0]-c[1]*h[1],im=c[0]*h[1]+c[1]*h[0];s+=re*Math.cos(n*w0*t)-im*Math.sin(n*w0*t);}return s;};
    const P=axes($('#a44'),[0,6],[-0.3,1.3],{xt:[[0,'0'],[2,'2'],[4,'4'],[6,'6']],yt:[[0,'0'],[1,'1']],xl:'t'});
    line(P,t=>(t%2)<1?1:0,0,6,css('--drop'),2,1200);line(P,y,0,6,css('--accent'),2.5,900);
    const Q=axes($('#b44'),[0,20],[0,1.15],{xt:[[3.14,'π'],[9.42,'3π'],[15.7,'5π']],yt:[[0,'0'],[1,'1']],xl:'ω'});
    line(Q,w=>Math.hypot(...H(w,p)),0,20,css('--accent'),2,600);[0,1,3,5].forEach(n=>stick(Q,n*w0,Math.hypot(...H(n*w0,p)),css('--keep')));
    $('#r44').innerHTML=[1,3,5].map(n=>{const h=H(n*w0,p);return `n=${n} (ω=${fmt(n*w0,2)}):  |H| = ${fmt(Math.hypot(...h),3)}   ∠H = ${fmt(Math.atan2(h[1],h[0])*180/Math.PI,1)}°   output amplitude ${fmt(2/(n*Math.PI)*Math.hypot(...h),3)}`;}).join('\n')+`\nDC: c₀·H(0) = ${fmt(0.5*Math.hypot(...H(0,p)),3)}`;
  }
  $('#p44').oninput=draw;draw();this.draw=draw;
  el.appendChild(quiz('c44',[
   {q:'x(t) = 1 + 2cos(2t) into H(jω) = 1/(1 + jω). The cosine comes out as…',o:['2cos(2t)','(2/√5)cos(2t − 63.4°)','2cos(2t − 45°)','(2/5)cos(2t)'],a:1,e:'|H(j2)| = 1/√5, ∠H(j2) = −tan⁻¹2 = −63.4°.'},
   {q:'The differentiator has H(jω) =',o:['1/(jω)','jω','e<sup>−jω</sup>','ω'],a:1,e:'x = e<sup>jωt</sup> gives y = jωe<sup>jωt</sup>.'},
   {q:'A pure delay t₀ changes cₙ to…',o:['cₙe<sup>−jnω₀t₀</sup>','cₙ/t₀','cₙ(jnω₀)','0'],a:0,e:'H(jnω₀) = e<sup>−jnω₀t₀</sup>; the result is x(t − t₀).'}]));
}});

/* 4.5 */
L.push({t:"Parseval's Theorem",s:'4.5',k:'4.5',build(el){
  el.innerHTML=`<div class="rule">P = (1/T₀)∫|x|² dt = Σ|cₙ|² = |c₀|² + Σₙ≥₁ 2|cₙ|²</div>
  <p class="try"><b>Try:</b> see how much of the total power the first N harmonics hold (Example 4.8). Find the N that reaches 99%.</p>
  <div class="controls"><div class="ctl"><label>Signal</label><div class="seg" id="s45"><button aria-pressed="true" data-v="sq">Square</button><button data-v="saw">Ramp</button><button data-v="ex">e^(−t)</button><button data-v="tri">Triangle</button></div></div>
  <div class="ctl"><label for="N45">Keep up to n = N</label><input id="N45" type="range" min="0" max="25" step="1" value="1"><output id="N45o"></output></div></div>
  <div class="scope"><figure><figcaption>Power in each harmonic: |c₀|² then 2|cₙ|² (bars)</figcaption><canvas id="a45"></canvas></figure><figure><figcaption>Cumulative % of total power vs N (dashed: 99%)</figcaption><canvas id="b45"></canvas></figure></div>
  <div class="readout" id="r45"></div>`;
  let key='sq';segs(el,'s45',null,v=>{key=v;draw();});
  function draw(){
    const S=SIG[key],N=+$('#N45').value;$('#N45o').textContent=N;const c=coeffs(S.f,S.T,25,3000);
    let Pt=0;for(let i=0;i<3000;i++){Pt+=sq(S.f((i+0.5)*S.T/3000));}Pt/=3000;
    const pw=n=>n===0?sq(cabs(c[0])):2*sq(cabs(c[n]));const mx=Math.max(...[...Array(26).keys()].map(pw));
    const P=axes($('#a45'),[-0.5,25.5],[0,mx*1.1],{xt:[0,5,10,15,20,25].map(v=>[v,String(v)]),yt:[[0,'0'],[mx,fmt(mx,3)]],xl:'n'});
    for(let n=0;n<=25;n++){P.g.fillStyle=n<=N?css('--accent'):css('--drop');P.g.fillRect(P.X(n)-4,P.Y(pw(n)),8,P.Y(0)-P.Y(pw(n)));}
    let cum=0;const pts=[];for(let n=0;n<=25;n++){cum+=pw(n);pts.push(100*cum/Pt);}
    const Q=axes($('#b45'),[-0.5,25.5],[0,105],{xt:[0,5,10,15,20,25].map(v=>[v,String(v)]),yt:[[0,'0'],[50,'50'],[99,'99'],[100,'']],xl:'N'});
    Q.g.strokeStyle=css('--warn');Q.g.setLineDash([5,4]);Q.g.beginPath();Q.g.moveTo(Q.X(-0.5),Q.Y(99));Q.g.lineTo(Q.X(25.5),Q.Y(99));Q.g.stroke();Q.g.setLineDash([]);
    pts.forEach((v,n)=>{Q.g.fillStyle=n<=N?css('--accent'):css('--drop');Q.g.beginPath();Q.g.arc(Q.X(n),Q.Y(Math.min(v,100)),4,0,7);Q.g.fill();});
    const n99=pts.findIndex(v=>v>=99);
    $('#r45').innerHTML=`total power (time domain) P = ${fmt(Pt,4)}\nDC power |c₀|² = ${fmt(pw(0),4)}  (${fmt(100*pw(0)/Pt,1)}%)\nkept up to N = ${N}: ${fmt(pts[N],2)}% of the power\n99% reached at N = ${n99>=0?n99:'> 25'}`;
  }
  $('#N45').oninput=draw;draw();this.draw=draw;
  el.appendChild(quiz('c45',[
   {q:'x = 2 + 4cos 3t − 2sin 5t. Average power?',o:['8','14','22','24'],a:1,e:'4 + 16/2 + 4/2 = 14.'},
   {q:'Real signal: the n-th harmonic (both ±n) carries power…',o:['|cₙ|','|cₙ|²','2|cₙ|²','4|cₙ|²'],a:2,e:'|cₙ|² + |c₋ₙ|² = 2|cₙ|².'},
   {q:'Example 4.9 uses Parseval on the square wave to prove…',o:['Σ1/n = ∞','Σ over odd n of 1/n² = π²/8','Σ1/n² = π²/6','e<sup>jπ</sup> = −1'],a:1,e:'½ = ¼ + Σodd 2/(π²n²) ⇒ Σodd 1/n² = π²/8.'}]));
}});

/* 4.6 */
L.push({t:'Geometric Interpretation & Approximation',s:'4.6–4.7',k:'4.6',build(el){
  el.innerHTML=`<div class="rule">orthogonal basis ⇒ cᵢ = ⟨x, φᵢ⟩ / ‖φᵢ‖²      Fourier: φₙ = e<sup>jnω₀t</sup>, ‖φₙ‖² = T₀ ⇒ cₙ = (1/T₀)∫x e<sup>−jnω₀t</sup>dt</div>
  <p class="try"><b>Try:</b> drag the vector x⃗. With the orthogonal basis each coefficient is one projection; with the skewed basis of the notes ([2,1], [1,1]) you must solve a 2×2 system.</p>
  <div class="controls"><div class="ctl"><label>Basis</label><div class="seg" id="s46"><button aria-pressed="true" data-v="o">Orthogonal [1,1], [−1,1]</button><button data-v="s">Skewed [2,1], [1,1]</button></div></div>
  <div class="ctl"><label for="x146">x₁</label><input id="x146" type="range" min="-8" max="8" step="1" value="7"><output id="x146o"></output></div>
  <div class="ctl"><label for="x246">x₂</label><input id="x246" type="range" min="-8" max="8" step="1" value="5"><output id="x246o"></output></div></div>
  <div class="scope"><figure><figcaption>x⃗ = c₁φ⃗₁ + c₂φ⃗₂</figcaption><canvas id="a46" style="height:300px"></canvas></figure></div>
  <div class="readout" id="r46"></div>`;
  let B='o';segs(el,'s46',null,v=>{B=v;draw();});
  function draw(){
    const x1=+$('#x146').value,x2=+$('#x246').value;$('#x146o').textContent=x1;$('#x246o').textContent=x2;
    const p1=B==='o'?[1,1]:[2,1],p2=B==='o'?[-1,1]:[1,1];
    const det=p1[0]*p2[1]-p2[0]*p1[1],c1=(x1*p2[1]-p2[0]*x2)/det,c2=(p1[0]*x2-x1*p1[1])/det;
    const P=axes($('#a46'),[-10,10],[-10,10],{xt:[[-8,'-8'],[0,'0'],[8,'8']],yt:[[-8,'-8'],[8,'8']]});
    const arr=(a,b,c,d,col,w)=>{P.g.strokeStyle=col;P.g.lineWidth=w;P.g.beginPath();P.g.moveTo(P.X(a),P.Y(b));P.g.lineTo(P.X(c),P.Y(d));P.g.stroke();};
    arr(0,0,c1*p1[0],c1*p1[1],css('--keep'),2.5);arr(c1*p1[0],c1*p1[1],x1,x2,css('--warn'),2.5);arr(0,0,x1,x2,css('--accent'),3);
    arr(0,0,p1[0],p1[1],css('--ink'),1.5);arr(0,0,p2[0],p2[1],css('--ink'),1.5);label(P,x1,x2+0.6,'x⃗',css('--accent'));label(P,p1[0],p1[1]-0.9,'φ⃗₁',css('--ink'));label(P,p2[0]-1,p2[1]+0.5,'φ⃗₂',css('--ink'));
    const d1=x1*p1[0]+x2*p1[1],d2=x1*p2[0]+x2*p2[1];
    $('#r46').innerHTML=B==='o'?`⟨x⃗,φ⃗₁⟩ = ${d1}, ‖φ⃗₁‖² = 2  ⇒  c₁ = ${fmt(d1/2)}\n⟨x⃗,φ⃗₂⟩ = ${d2}, ‖φ⃗₂‖² = 2  ⇒  c₂ = ${fmt(d2/2)}\none projection each, no system to solve`:`⟨x⃗,φ⃗₁⟩ = ${d1} = 5c₁ + 3c₂\n⟨x⃗,φ⃗₂⟩ = ${d2} = 3c₁ + 2c₂\nsolve the 2×2 system ⇒ c₁ = ${fmt(c1)}, c₂ = ${fmt(c2)}`;
  }
  ['#x146','#x246'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('c46',[
   {q:'Why are Fourier coefficients easy to compute one at a time?',o:['Because x is periodic','Because the harmonics e<sup>jnω₀t</sup> are orthogonal','Because T₀ = 1','Because cₙ are real'],a:1,e:'Orthogonality kills every cross term, so each cₙ is a single projection.'},
   {q:'The best N-term approximation of x(t) in the integrated-square-error sense is…',o:['any N harmonics','the truncated Fourier series','the first N samples','the DC term only'],a:1,e:'Proposition 4.5: ISE is minimized by ĉₙ = ⟨x,φₙ⟩/‖φₙ‖², the Fourier coefficients.'},
   {q:'‖e<sup>jnω₀t</sup>‖² over one period equals…',o:['1','T₀','2π','n'],a:1,e:'∫₀<sup>T₀</sup>|e<sup>jnω₀t</sup>|²dt = ∫₀<sup>T₀</sup>1 dt = T₀.'}]));
}});

/* ---------- shell ---------- */
let cur=0;
function show(i){
  cur=i;const nav=$('#nav');nav.querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
  const m=$('#main');m.innerHTML='';const sec=document.createElement('section');sec.className='lesson';
  const K=(typeof KEY!=='undefined'&&KEY[L[i].k])||null;
  sec.innerHTML=`<div><div class="eyebrow">Notes §${L[i].s} · page ${i+1} of ${L.length}</div><h2>${L[i].s} ${L[i].t}</h2></div>`+
  (K?`<div class="summary"><div class="kidea"><span class="tag">Big idea</span><p>${K.idea}</p></div>
   <div class="sgrid"><div class="fbox"><h3>Formulas to know</h3><ul>${K.f.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="howto"><h3>How to use it</h3><ol>${K.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></div>
   <div class="cpic"><h3>Picture it</h3>${K.fig()}</div></div>`:'')+
  `<details class="notes"><summary>Full notes · §${L[i].s} (tap to open)</summary>${NOTES[L[i].k]||''}</details>`+
  (MORE[L[i].k]?`<details class="notes ex" open><summary>Worked examples &amp; exam traps</summary>${MORE[L[i].k]}</details>`:'')+
  `<h3 class="tryh">Try it live</h3>`;
  const body=document.createElement('div');body.style.display='flex';body.style.flexDirection='column';body.style.gap='16px';sec.appendChild(body);m.appendChild(sec);
  L[i].build.call(L[i],body);
  const nr=document.createElement('div');nr.className='navrow';
  nr.innerHTML=`<button type="button" id="prev" ${i?'':'hidden'}>← ${i?L[i-1].t:''}</button><span class="score" id="score"></span><button type="button" class="next" id="next" ${i<L.length-1?'':'hidden'}>${i<L.length-1?L[i+1].t+' →':''}</button>`;
  sec.appendChild(nr);$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);updScore();
  try{localStorage.setItem('ch4lab',i)}catch(e){}
}
function go(i){location.hash='lesson'+(i+1);}
function fromHash(){const m=/lesson(\d+)/.exec(location.hash);let i=m?+m[1]-1:0;if(!m){try{i=+(localStorage.getItem('ch4lab')||0)}catch(e){}}show(Math.min(Math.max(i,0),L.length-1));window.scrollTo({top:0});}
L.forEach((l,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span class="n">${l.s}</span><span>${l.t}</span>`;b.onclick=()=>go(i);$('#nav').appendChild(b);});
window.addEventListener('hashchange',fromHash);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>L[cur].draw&&L[cur].draw(),120);});
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>L[cur].draw&&L[cur].draw());
new MutationObserver(()=>L[cur].draw&&L[cur].draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts&&document.fonts.ready.then(()=>L[cur].draw&&L[cur].draw());
fromHash();
</script>
</body></html>
