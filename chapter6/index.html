<script>
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(x,d=3)=>!isFinite(x)?"∞":(Math.abs(x)<1e-9?"0":(+x.toFixed(d)).toString());
const sq=x=>x*x;

/* ---------- canvas plotting ---------- */
function setup(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(10,r.width*dpr);c.height=Math.max(10,r.height*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return{g,w:r.width,h:r.height};}
function axes(c,xr,yr,o={}){
  const {g,w,h}=setup(c);const L=o.left??38,R=10,T=10,B=o.bottom??24;
  const X=x=>L+(x-xr[0])/(xr[1]-xr[0])*(w-L-R), Y=y=>h-B-(y-yr[0])/(yr[1]-yr[0])*(h-T-B);
  g.font='11px "JetBrains Mono",monospace';g.fillStyle=css('--muted');g.strokeStyle=css('--grid');g.lineWidth=1;
  (o.xt||[]).forEach(([v,l])=>{g.beginPath();g.moveTo(X(v),T);g.lineTo(X(v),h-B);g.stroke();g.textAlign='center';g.fillText(l,X(v),h-B+14);});
  (o.yt||[]).forEach(([v,l])=>{g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.textAlign='right';g.fillText(l,L-5,Y(v)+4);});
  g.strokeStyle=css('--muted');g.beginPath();g.moveTo(L,T);g.lineTo(L,h-B);g.lineTo(w-R,h-B);g.stroke();
  if(o.xl){g.textAlign='right';g.fillText(o.xl,w-R,h-B-5);}
  return{g,X,Y,w,h,L,R,T,B};
}
function line(P,f,x0,x1,col,lw=2,n=500,dash){const{g,X,Y}=P;g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));}g.stroke();g.setLineDash([]);}
function stick(P,x,y,col){const{g,X,Y}=P;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=3;g.beginPath();g.moveTo(X(x),Y(0));g.lineTo(X(x),Y(y));g.stroke();g.beginPath();g.arc(X(x),Y(y),4.5,0,7);g.fill();}
function label(P,x,y,t,col,align='left'){P.g.fillStyle=col;P.g.textAlign=align;P.g.font='12px "JetBrains Mono",monospace';P.g.fillText(t,P.X(x),P.Y(y));}

/* ---------- quiz helper ---------- */
const score={};
function quiz(id,items){
  const box=document.createElement('div');box.className='quiz';box.innerHTML='<h3>Check yourself</h3>';
  items.forEach((it,qi)=>{const q=document.createElement('div');q.className='q';q.innerHTML=`<p>${qi+1}. ${it.q}</p>`;const opts=document.createElement('div');opts.className='opts';const fb=document.createElement('div');fb.className='fb';
    it.o.forEach((t,oi)=>{const b=document.createElement('button');b.type='button';b.innerHTML=t;b.onclick=()=>{
      opts.querySelectorAll('button').forEach(x=>x.classList.remove('right','wrong'));
      const ok=oi===it.a;b.classList.add(ok?'right':'wrong');fb.className='fb '+(ok?'right':'wrong');
      fb.innerHTML=(ok?'Right. ':'Not quite. ')+it.e;score[id+qi]=ok;updScore();};opts.appendChild(b);});
    q.append(opts,fb);box.appendChild(q);});
  return box;
}
function updScore(){const v=Object.values(score);const el=$('#score');if(el)el.textContent=`${v.filter(Boolean).length} correct so far`;}

/* ---------- detailed notes, keyed by page ---------- */
const NOTES={
'6.1':`
<p>The opening of Chapter 6 (from Oppenheim &amp; Willsky): in many applications we want to change the relative amplitudes of the frequency components in a signal, or remove some of them entirely. This is <b>filtering</b>. For an LTI system the output spectrum is the input spectrum multiplied by the frequency response,</p>
<div class="eq">Y(jω) = H(jω) · X(jω)</div>
<p>so filtering is done simply by choosing H(jω). Example: the bass/treble controls of a stereo change H to boost or cut low and high frequencies; an <b>equalizer</b> compensates for the speakers' frequency response.</p>
<h4>Ideal frequency-selective filter</h4>
<p>Passes complex exponentials at certain frequencies <b>without change</b> (gain 1) and <b>completely stops</b> all others (gain 0). The frequencies that pass form the <b>passband</b>; the ones that are stopped form the <b>stopband</b>.</p>
<table class="nt">
<tr><th>Filter</th><th>Passband</th><th>Stopband</th></tr>
<tr><td>Low-pass (LPF)</td><td>|ω| &lt; ω<sub>c</sub></td><td>|ω| &gt; ω<sub>c</sub></td></tr>
<tr><td>High-pass (HPF)</td><td>|ω| &gt; ω<sub>c</sub></td><td>|ω| &lt; ω<sub>c</sub></td></tr>
<tr><td>Band-pass (BPF)</td><td>ω<sub>1</sub> &lt; |ω| &lt; ω<sub>2</sub></td><td>|ω| &lt; ω<sub>1</sub> and |ω| &gt; ω<sub>2</sub></td></tr>
<tr><td>Band-stop (BSF)</td><td>|ω| &lt; ω<sub>1</sub> and |ω| &gt; ω<sub>2</sub></td><td>ω<sub>1</sub> &lt; |ω| &lt; ω<sub>2</sub></td></tr>
</table>
<p>ω<sub>c</sub> is the <b>cut-off frequency</b>. The plots are symmetric in ω because real filters have |H(−jω)| = |H(jω)|.</p>
<div class="nx"><b>How to use it on a problem:</b> list the frequencies present in x(t), check each one against the passband, keep (×1) or delete (×0). For a periodic input the frequencies are the harmonics nω<sub>0</sub> (Ch 4.4).</div>`,

'6.2a':`
<p>The ideal filters of 6.1 have two features real filters cannot have: abrupt cut-offs, and a frequency response that is real and non-negative (∠H = 0).</p>
<h4>1. Linear phase does not distort</h4>
<p>If a filter has <b>linear phase</b> ∠H(jω) = −ωt<sub>d</sub> (t<sub>d</sub> constant) and flat magnitude, then</p>
<div class="eq">H(jω) = e<sup>−jωt<sub>d</sub></sup> &nbsp;⇒&nbsp; Y(jω) = e<sup>−jωt<sub>d</sub></sup>X(jω) &nbsp;⇒&nbsp; y(t) = x(t − t<sub>d</sub>)</div>
<p>(time-shift property). The signal is only delayed by t<sub>d</sub>. So when we build filters the goal is a phase that is <b>nearly linear</b> in the passband.</p>
<p><b>Definition 6.1 (Filter delay).</b> For H(jω) = |H(jω)|e<sup>j∠H(jω)</sup>,</p>
<div class="eq">D(jω) = d[∠H(jω)] / dω &nbsp;&nbsp;&nbsp;(6.1)</div>
<p>For a distortionless filter the filter delay is constant with respect to ω.</p>
<h4>2. Abrupt transitions cannot be built</h4>
<p>Take the ideal LPF: |H| = 1 for |ω| &lt; ω<sub>c</sub>, 0 otherwise, phase −ωt<sub>d</sub>. Its impulse response:</p>
<div class="eq">h(t) = (1/2π)∫ H(jω)e<sup>jωt</sup>dω = (1/2π)∫<sub>−ω<sub>c</sub></sub><sup>ω<sub>c</sub></sup> e<sup>jω(t−t<sub>d</sub>)</sup>dω<br>= (ω<sub>c</sub>/π) · sin[ω<sub>c</sub>(t−t<sub>d</sub>)] / [ω<sub>c</sub>(t−t<sub>d</sub>)] = (ω<sub>c</sub>/π) · sinc[ω<sub>c</sub>(t−t<sub>d</sub>)/π]</div>
<p>Step in the middle: the integral is [e<sup>jω(t−t<sub>d</sub>)</sup>/(j(t−t<sub>d</sub>))] from −ω<sub>c</sub> to ω<sub>c</sub> = 2j sin(ω<sub>c</sub>(t−t<sub>d</sub>))/(j(t−t<sub>d</sub>)). Shortcut: the pair (ω<sub>c</sub>/π)sinc(ω<sub>c</sub>t/π) ↔ rect(ω/2ω<sub>c</sub>) plus the time-shift property.</p>
<p><b>h(t) ≢ 0 for t &lt; 0 ⇐ this filter is not causal and therefore it cannot be built!</b> (Ch 3: an LTI system is causal iff h(t) = 0 for all t &lt; 0.) Increasing t<sub>d</sub> moves the sinc right but its left tail never vanishes.</p>`,

'6.2b':`
<p>To get a <b>realizable</b> filter we must relax the requirements on |H(jω)|. The specification for a realizable low-pass filter becomes</p>
<div class="eq">1 − δ<sub>1</sub> ≤ |H(jω)| ≤ 1 + δ<sub>1</sub>, &nbsp;&nbsp;|ω| ≤ ω<sub>p</sub> &nbsp;&nbsp;&nbsp;(6.2)<br>|H(jω)| ≤ δ<sub>2</sub>, &nbsp;&nbsp;|ω| ≥ ω<sub>s</sub> &nbsp;&nbsp;&nbsp;(6.3)</div>
<ul>
<li>ω<sub>p</sub> = nominal <b>pass-band</b> cut-off frequency; δ<sub>1</sub> = allowed passband ripple.</li>
<li>ω<sub>s</sub> = nominal <b>stop-band</b> cut-off frequency; δ<sub>2</sub> = largest allowed stopband gain.</li>
<li>The range ω<sub>p</sub> &lt; |ω| &lt; ω<sub>s</sub> is the <b>transition band</b>: no requirement there.</li>
</ul>
<p>The transition band replaces the impossible instant cliff with a slope. Smaller δ's or a narrower transition band (ω<sub>s</sub> closer to ω<sub>p</sub>) are harder to meet and need a higher-order (more expensive) filter.</p>
<div class="nx"><b>Reading a word problem:</b> "gain between 0.95 and 1.05 up to 2 kHz" → δ<sub>1</sub> = 0.05, ω<sub>p</sub> = 2π·2000. "at least 40 dB down above 8 kHz" → δ<sub>2</sub> = 0.01, ω<sub>s</sub> = 2π·8000.</div>`,

'6.2c':`
<p><b>Example 6.1.</b> A filter is <b>passive</b> if it has no gain/amplifying elements (only R, L, C). <b>Active</b> filters contain gain elements such as transistors or op-amps; at low frequencies, active filters made of op-amps, resistors and capacitors are common (your Lab IV IF filter is an active band-pass).</p>
<p>Passive RC low-pass filter (series R, output across C). By the voltage divider:</p>
<div class="eq">H(jω) = (1/jωC) / (1/jωC + R) = 1 / (1 + jωRC)<br>|H(jω)| = 1/√(1 + (ωRC)²), &nbsp;&nbsp;∠H(jω) = −tan<sup>−1</sup>(ωRC)</div>
<p>In the notes RC = 10<sup>−4</sup> s. Unlike the ideal LPF there is no sharp cut-off. The <b>3 dB cut-off</b> (where 20log<sub>10</sub>|H| = −3 dB) is at ω = 1/RC = 10<sup>4</sup> rad/s, and beyond it the magnitude falls about <b>20 dB/decade</b> (a decade = a factor of 10 in frequency).</p>
<p><b>Bode plots</b> = 20log<sub>10</sub>|H(jω)| vs ω and ∠H(jω) vs ω, with a <b>log</b> frequency axis (to cover a large frequency range). We plot dB rather than |H| to handle a large dynamic range: values like 10<sup>−4</sup> would be invisible on a linear plot but read as −80 dB.</p>
<table class="nt"><tr><th>|H|</th><td>1</td><td>1/√2</td><td>½</td><td>0.1</td><td>0.01</td><td>10⁻⁴</td></tr><tr><th>dB</th><td>0</td><td>−3</td><td>−6</td><td>−20</td><td>−40</td><td>−80</td></tr></table>
<div class="nx"><b>Numbers for RC = 10<sup>−4</sup>:</b> ω = 10<sup>3</sup>: ≈ 0 dB, −5.7°. ω = 10<sup>4</sup>: −3 dB, −45°. ω = 10<sup>5</sup>: ≈ −20 dB, −84°. ω = 10<sup>6</sup>: ≈ −40 dB, ≈ −90°.</div>`,

'6.3':`
<p>If H(jω) can be written in <b>rational form</b></p>
<div class="eq">H(jω) = N(s) / D(s), &nbsp;&nbsp;s ≡ jω &nbsp;&nbsp;&nbsp;(6.4)</div>
<p>where N(s) and D(s) are polynomials in s with real coefficients, MATLAB's <code>bode</code> command draws the Bode plots:</p>
<ol><li>Write N(s) and D(s) as vectors N and D of polynomial coefficients in <b>descending</b> powers of s.</li><li>Run <code>bode(N,D)</code>.</li></ol>
<p><b>Example 6.2</b> (2nd-order Butterworth low-pass):</p>
<div class="eq">H(jω) = 10<sup>10</sup> / [(10<sup>10</sup> − ω²) + j√2·10<sup>5</sup>ω] = 10<sup>10</sup> / [(jω)² + √2·10<sup>5</sup>(jω) + 10<sup>10</sup>]</div>
<p>So N(s) = 10<sup>10</sup>, D(s) = s² + √2·10<sup>5</sup>s + 10<sup>10</sup>, giving <code>N = [1.0E10]; D = [1 1.414E05 1.0E10]; bode(N,D)</code>.</p>
<div class="nx"><b>Trick to remember:</b> (jω)² = −ω², so a real part like (10<sup>10</sup> − ω²) comes from s² + 10<sup>10</sup>. Every power of s must appear in D, with 0 for missing ones (e.g. s³ + 2 → <code>[1 0 0 2]</code>).</div>`,

'6.4':`
<p>Filter design specifications are given as a <b>spectral mask</b>. Any design H(jω) whose |H(jω)| "satisfies" the mask is acceptable. The specs are augmented by two wishes: ∠H(jω) <b>as linear as possible</b> in the passband, and <b>as low cost as possible</b>, which usually means a small maximum degree of the polynomials N(jω) and D(jω) in H = N/D.</p>
<p>The mask parameters in the notes: passband edge ω<sub>p</sub>, stopband edge ω<sub>s</sub>, passband gain limits G<sub>1</sub> ≤ |H| ≤ G<sub>2</sub>, stopband limit |H| ≤ δ<sub>s</sub>. Masks for HPF, BPF (edges ω<sub>s</sub><sup>1</sup> &lt; ω<sub>p</sub><sup>1</sup> &lt; ω<sub>p</sub><sup>2</sup> &lt; ω<sub>s</sub><sup>2</sup>) and BSF (ω<sub>p</sub><sup>1</sup> &lt; ω<sub>s</sub><sup>1</sup> &lt; ω<sub>s</sub><sup>2</sup> &lt; ω<sub>p</sub><sup>2</sup>) are drawn the same way.</p>
<p><b>Plan:</b> build LPF, HPF, BPF and BSF starting from one <b>prototype LPF</b> and applying transformations. The prototype used is the <b>Butterworth filter of order N</b>:</p>
<div class="eq">H(jω) = 1 / ∏<sub>k=1</sub><sup>N</sup>(jω − s<sub>k</sub>), &nbsp;&nbsp; s<sub>k</sub> = e<sup>j(2k+N−1)π/2N</sup>, k = 1, 2, …, N &nbsp;&nbsp;&nbsp;(6.5)</div>
<p>The poles s<sub>k</sub> lie on the <b>unit circle</b>, in the <b>left half plane</b>, spaced π/N apart.</p>
<p><b>Example 6.3.</b> N = 1: s<sub>1</sub> = e<sup>jπ</sup> = −1, so H = 1/(jω + 1). N = 2: s<sub>1,2</sub> = e<sup>j3π/4</sup>, e<sup>j5π/4</sup> = −1/√2 ± j/√2, so</p>
<div class="eq">H(jω) = 1 / [(jω − e<sup>j3π/4</sup>)(jω − e<sup>j5π/4</sup>)] = 1 / [(jω)² + √2(jω) + 1]</div>
<p>(Product of a conjugate pair: (s − p)(s − p*) = s² − 2Re{p}s + |p|² = s² + √2 s + 1.)</p>`,

'6.4.1':`
<p>The magnitude of the Butterworth FRF (6.5) is (not straightforward to show, but a good exercise)</p>
<div class="eq">|H(jω)| = 1 / √(1 + ω<sup>2N</sup>) &nbsp;&nbsp;&nbsp;(6.6)</div>
<ul><li>H(j0) = 1, &nbsp;|H(j1)| = 1/√2 (−3 dB at ω = 1 for every N), &nbsp;lim<sub>ω→±∞</sub>|H| = 0.</li>
<li>As N increases: <b>flatter</b> passband and <b>sharper</b> transition to the stopband (roll-off −20N dB/decade).</li></ul>
<p><b>Check N = 2:</b> |(jω)² + √2 jω + 1|² = (1 − ω²)² + 2ω² = 1 + ω<sup>4</sup> ✓.</p>
<h4>Implementing with R, C and op-amps</h4>
<p><b>Example 6.4 (N = 1).</b> RC low-pass followed by an op-amp buffer. Golden rules: Z̃ = Ỹ and Z̃ = X̃·(1/jωC)/(R + 1/jωC), so H = 1/(1 + RC·jω). Set RC = 1 for the prototype; in general ω<sub>0</sub> = 1/RC gives Ĥ = 1/(1 + jω/ω<sub>0</sub>). The buffer is not needed alone, but when filters are chained it stops one stage from <b>loading</b> the previous one.</p>
<p><b>Example 6.5 (N = 2).</b> Op-amp (Sallen-Key-type) stage with gain A = 1 + R<sub>4</sub>/R<sub>3</sub>. Nodal analysis (eqs. 6.7–6.11) gives</p>
<div class="eq">H(jω) = A / [1 + (R<sub>1</sub>C<sub>1</sub> + R<sub>2</sub>C<sub>2</sub> + R<sub>1</sub>C<sub>2</sub> − AR<sub>1</sub>C<sub>1</sub>)jω + R<sub>1</sub>C<sub>1</sub>R<sub>2</sub>C<sub>2</sub>(jω)²]</div>
<p>With R<sub>1</sub> = R<sub>2</sub> = R, C<sub>1</sub> = C<sub>2</sub> = C: &nbsp;H = A / [1 + (3 − A)RC jω + (RC)²(jω)²]. Choose RC = 1 and 3 − A = √2 (A ≈ 1.59) to get the 2nd-order Butterworth (times the gain A). In general ω<sub>0</sub> = 1/RC: Ĥ = A / [1 + √2(jω/ω<sub>0</sub>) + (jω/ω<sub>0</sub>)²].</p>
<p><b>Example 6.6 (any N).</b> Chain 2nd-order stages, plus one 1st-order stage if N is odd. For N even, pairing conjugate poles:</p>
<div class="eq">H(jω) = ∏<sub>n=1</sub><sup>N/2</sup> 1 / [1 − 2cos((2n+N−1)π/2N)(jω) + (jω)²] &nbsp;&nbsp;&nbsp;(6.12–6.14)</div>
<p>Each factor is a stage like Example 6.5 with RC = 1 and 3 − A = −2cos((2n+N−1)π/2N) (positive, since those poles are in the left half plane).</p>`,

'6.4.2a':`
<p>Each filter type is the prototype with ω replaced by a new expression. G sets the passband height.</p>
<h4>LPF: &nbsp;jω → jω′/ω<sub>0</sub> &nbsp;(ω → ω′/ω<sub>0</sub>)</h4>
<div class="eq">|Ĥ(jω′)| = G / √(1 + (ω′/ω<sub>0</sub>)<sup>2N</sup>) &nbsp;&nbsp;&nbsp;(6.15)</div>
<p>Moves the −3 dB point from 1 to ω<sub>0</sub>. In the circuit: every resistor/capacitor is scaled.</p>
<h4>HPF: &nbsp;jω → 1/(jω′/ω<sub>0</sub>) &nbsp;(ω → −ω<sub>0</sub>/ω′)</h4>
<div class="eq">|Ĥ(jω′)| = G / √(1 + ω<sub>0</sub><sup>2N</sup>/ω′<sup>2N</sup>) = G·√(ω′<sup>2N</sup> / (ω′<sup>2N</sup> + ω<sub>0</sub><sup>2N</sup>)) &nbsp;&nbsp;&nbsp;(6.16–6.17)</div>
<p>Low ω′ now gives a huge ratio (gain → 0), high ω′ gives gain → G. Circuit: every capacitor (inductor) becomes an inductor (capacitor), or in the RC stages R and C swap places.</p>
<h4>BPF: &nbsp;jω → j·ω′/(ω<sub>2</sub>−ω<sub>1</sub>) + ω<sub>1</sub>ω<sub>2</sub>/[(ω<sub>2</sub>−ω<sub>1</sub>)² · jω′/(ω<sub>2</sub>−ω<sub>1</sub>)]</h4>
<div class="eq">ω → (ω′² − ω<sub>1</sub>ω<sub>2</sub>) / (ω′(ω<sub>2</sub> − ω<sub>1</sub>)) &nbsp;&nbsp;&nbsp;(6.19)<br>|Ĥ(jω′)| = G / √(1 + [(ω′² − ω<sub>1</sub>ω<sub>2</sub>)/(ω′(ω<sub>2</sub>−ω<sub>1</sub>))]<sup>2N</sup>) &nbsp;&nbsp;&nbsp;(6.18)</div>
<p>Prototype ω = 0 → ω′ = √(ω<sub>1</sub>ω<sub>2</sub>) (center, full gain); ω = ±1 → ω′ = ω<sub>1</sub>, ω<sub>2</sub> (−3 dB edges). Circuit: every Cjω becomes Ĉjω + 1/(Ljω).</p>
<h4>BSF: &nbsp;LPF → HPF prototype (jω → 1/jω′), then HPF → BSF (same substitution as BPF)</h4>
<div class="eq">ω → ω′(ω<sub>2</sub> − ω<sub>1</sub>) / (ω<sub>1</sub>ω<sub>2</sub> − ω′²) &nbsp;&nbsp;&nbsp;(6.21)<br>|Ĥ(jω′)| = G / √(1 + [ω′(ω<sub>2</sub>−ω<sub>1</sub>)/(ω<sub>1</sub>ω<sub>2</sub>−ω′²)]<sup>2N</sup>) &nbsp;&nbsp;&nbsp;(6.22)</div>
<p>Circuit: every capacitor becomes a series combination of a capacitor and an inductor.</p>`,

'6.4.2b':`
<p>To finish a design, find the parameters (G, ω<sub>0</sub>, N) — or (G, ω<sub>1</sub>, ω<sub>2</sub>, N) for band filters — that satisfy the mask inequalities, with <b>N the minimal integer</b>:</p>
<div class="eq">G<sub>1</sub> ≤ G ≤ G<sub>2</sub>, &nbsp;&nbsp;|Ĥ(jω<sub>p</sub>)| ≥ G<sub>1</sub>, &nbsp;&nbsp;|Ĥ(jω<sub>s</sub>)| ≤ δ<sub>s</sub></div>
<p>Solving inequalities is hard, so the notes match the mask with equalities: G = G<sub>2</sub>, |Ĥ(jω<sub>p</sub>)| = G<sub>1</sub>, |Ĥ(jω<sub>s</sub>)| = δ<sub>s</sub>, then round N up.</p>
<h4>Worked recipe (LPF)</h4>
<ol>
<li>G = G<sub>2</sub>.</li>
<li>Passband: G/√(1 + (ω<sub>p</sub>/ω<sub>0</sub>)<sup>2N</sup>) ≥ G<sub>1</sub> &nbsp;⇔&nbsp; (ω<sub>p</sub>/ω<sub>0</sub>)<sup>2N</sup> ≤ (G/G<sub>1</sub>)² − 1 ≡ α</li>
<li>Stopband: G/√(1 + (ω<sub>s</sub>/ω<sub>0</sub>)<sup>2N</sup>) ≤ δ<sub>s</sub> &nbsp;⇔&nbsp; (ω<sub>s</sub>/ω<sub>0</sub>)<sup>2N</sup> ≥ (G/δ<sub>s</sub>)² − 1 ≡ β</li>
<li>Divide (ω<sub>0</sub> cancels): (ω<sub>s</sub>/ω<sub>p</sub>)<sup>2N</sup> ≥ β/α &nbsp;⇒&nbsp; <b>N ≥ ln(β/α) / (2 ln(ω<sub>s</sub>/ω<sub>p</sub>))</b>, round up.</li>
<li>Then ω<sub>p</sub>·α<sup>−1/2N</sup> ≤ ω<sub>0</sub> ≤ ω<sub>s</sub>·β<sup>−1/2N</sup>.</li>
</ol>
<p><b>HPF:</b> the same with (ω<sub>0</sub>/ω) in place of (ω/ω<sub>0</sub>), so the ratio becomes ω<sub>p</sub>/ω<sub>s</sub> (passband is above the stopband).</p>
<div class="nx"><b>Example:</b> G = 1, |H| ≥ 0.9 at 1000 rad/s, |H| ≤ 0.1 at 3000 rad/s. α = 0.2346, β = 99, β/α = 422, N ≥ ln 422/(2 ln 3) = 2.75 → <b>N = 3</b>, ω<sub>0</sub> ∈ [1273, 1395] rad/s. This is the default spec in the calculator below.</div>`,

'6.5':`
<p><b>Definition 6.2.</b> Signals whose Fourier transforms are concentrated around 0 rad/s are <b>baseband</b> signals. <b>Definition 6.3.</b> Signals whose Fourier transforms are concentrated around some ω<sub>c</sub> are <b>bandpass</b> signals. The notes give four measures of bandwidth (assume x real, so |X| is even):</p>
<h4>6.5.1 Absolute bandwidth</h4>
<p>Baseband: BW<sub>abs</sub> = ω<sub>B</sub>, the highest nonzero frequency component of |X(jω)|. Bandpass: BW<sub>abs</sub> = ω<sub>2</sub> − ω<sub>1</sub>. If |X| extends to ∞, BW<sub>abs</sub> = ∞.</p>
<h4>6.5.2 3 dB or half-power bandwidth</h4>
<p>Baseband: BW<sub>3dB</sub> = ω<sub>B</sub> where |X(jω<sub>B</sub>)| = |X(j0)|/√2. Bandpass: BW<sub>3dB</sub> = ω<sub>2</sub> − ω<sub>1</sub> with |X(jω<sub>1</sub>)| = |X(jω<sub>2</sub>)| = |X(jω<sub>c</sub>)|/√2, ω<sub>1</sub> &lt; ω<sub>c</sub> &lt; ω<sub>2</sub>.</p>
<p><b>Example 6.7 (RC filter).</b> H = 1/(1 + jωRC), H(j0) = 1. Set 1/(1 + ω<sub>B</sub>²(RC)²) = ½ ⇒ <b>ω<sub>B</sub> = 1/RC</b>.</p>
<h4>6.5.3 Noise-equivalent bandwidth</h4>
<p>Take the energy spectral density S(ω) = (1/2π)|X(jω)|². Replace it by a flat "equivalent" S′ = S(0) for |ω| &lt; ω<sub>B</sub> with the <b>same energy</b>: 2ω<sub>B</sub>·(1/2π)|X(j0)|² = (1/2π)∫|X|²dω, so</p>
<div class="eq">BW<sub>ne</sub> = ω<sub>B</sub> = ∫<sub>0</sub><sup>∞</sup>|X(jω)|²dω / |X(j0)|² &nbsp;&nbsp;(6.25) &nbsp;&nbsp;&nbsp;&nbsp;bandpass: ∫<sub>0</sub><sup>∞</sup>|X|²dω / |X(jω<sub>c</sub>)|² &nbsp;&nbsp;(6.26)</div>
<h4>6.5.4 RMS bandwidth</h4>
<p>Like a standard deviation of |X|²:</p>
<div class="eq">BW<sub>rms</sub> = √( ∫<sub>0</sub><sup>∞</sup>ω²|X|²dω / ∫<sub>0</sub><sup>∞</sup>|X|²dω ) &nbsp;(6.27) &nbsp;&nbsp;&nbsp;bandpass: √( ∫<sub>0</sub><sup>∞</sup>(ω−ω<sub>c</sub>)²|X|²dω / ∫<sub>0</sub><sup>∞</sup>|X|²dω ) &nbsp;(6.28)</div>
<p>with ω<sub>c</sub> = ∫<sub>0</sub><sup>∞</sup>ω|X|²dω / ∫<sub>0</sub><sup>∞</sup>|X|²dω, the "center of gravity" of |X|² on the positive side.</p>
<p><b>Example 6.8 (ideal LPF, height A, edge ω<sub>B</sub>).</b> BW<sub>rms</sub> = √( A²(ω<sub>B</sub>³/3) / (A²ω<sub>B</sub>) ) = <b>ω<sub>B</sub>/√3</b>.</p>
<p><b>Example 6.9 / Definition 6.4 (RMS time duration).</b> The same idea for how spread out x(t) is in time:</p>
<div class="eq">τ<sub>RMS</sub> = √( ∫(t − t<sub>0</sub>)²|x(t)|²dt / ∫|x(t)|²dt ), &nbsp;&nbsp; t<sub>0</sub> = ∫t|x(t)|²dt / ∫|x(t)|²dt &nbsp;&nbsp;(6.29–6.30)</div>
<p>t<sub>0</sub> estimates where the signal has most of its energy.</p>`
};

/* ---------- lessons ---------- */
const L=[];

/* 1. What a filter does */
L.push({t:'Ideal Frequency Selective Filters',s:'6.1',k:'6.1',build(el){
  el.innerHTML=`<div class="rule">output at ω = |H(jω)| × input at ω   (Y = H · X)</div>
  <p class="try">The input here is <b>x(t) = 1 + cos(2t) + 0.8cos(7t) + 0.6cos(15t)</b>: a constant plus waves at ω = 2, 7 and 15. <b>Try:</b> pick a filter type and drag the cutoff past each stick.</p>
  <div class="controls">
    <div class="ctl"><label>Filter type</label><div class="seg" id="ft"><button aria-pressed="true" data-v="LP">Lowpass</button><button data-v="HP">Highpass</button><button data-v="BP">Bandpass</button><button data-v="BS">Bandstop</button></div></div>
    <div class="ctl"><label for="c1">Cutoff ω₁</label><input id="c1" type="range" min="0.5" max="18" step="0.5" value="5"><output id="c1o"></output></div>
    <div class="ctl" id="c2box" hidden><label for="c2">Upper edge ω₂</label><input id="c2" type="range" min="1" max="20" step="0.5" value="10"><output id="c2o"></output></div>
  </div>
  <div class="scope"><figure><figcaption>Frequency view: sticks = waves in the signal, shaded = what the filter keeps</figcaption><canvas id="s1a"></canvas></figure>
  <figure><figcaption>Time view: input (faint) and output (green)</figcaption><canvas id="s1b"></canvas></figure></div>
  <div class="readout" id="r1"></div>`;
  const comps=[[0,1],[2,1],[7,.8],[15,.6]];let type='LP';
  el.querySelectorAll('#ft button').forEach(b=>b.onclick=()=>{type=b.dataset.v;el.querySelectorAll('#ft button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
  const keep=w=>{const a=+$('#c1').value,b=+$('#c2').value;return type==='LP'?w<a:type==='HP'?w>a:type==='BP'?(w>a&&w<b):!(w>a&&w<b);};
  function draw(){
    const a=+$('#c1').value,b=+$('#c2').value;$('#c1o').textContent=a+' rad/s';$('#c2o').textContent=b+' rad/s';$('#c2box').hidden=!(type==='BP'||type==='BS');
    const P=axes($('#s1a'),[0,20],[0,1.25],{xt:[[0,'0'],[2,'2'],[7,'7'],[15,'15'],[20,'ω']],yt:[[0,'0'],[1,'1']]});
    P.g.fillStyle=css('--accent-soft');for(let x=0;x<20;x+=0.05){if(keep(x+0.025))P.g.fillRect(P.X(x),P.Y(1.15),P.X(x+0.05)-P.X(x)+0.5,P.Y(0)-P.Y(1.15));}
    line(P,x=>keep(x)?1.15:0,0,20,css('--accent'),2,800);
    comps.forEach(([w,A])=>stick(P,w,A,keep(w)?css('--keep'):css('--drop')));
    const Q=axes($('#s1b'),[0,6.3],[-2.2,4],{xt:[[0,'0'],[3.14,'π'],[6.28,'2π']],yt:[[0,'0'],[2,'2']],xl:'t'});
    const sig=(t,f)=>comps.reduce((s,[w,A])=>s+(f(w)?A*Math.cos(w*t):0),0);
    line(Q,t=>sig(t,()=>true),0,6.3,css('--drop'),1.5,900);line(Q,t=>sig(t,keep),0,6.3,css('--keep'),2.5,900);
    const out=comps.filter(([w])=>keep(w)).map(([w,A])=>w===0?'1':`${A===1?'':A}cos(${w}t)`);
    $('#r1').innerHTML=`kept:    ω = ${comps.filter(([w])=>keep(w)).map(c=>c[0]).join(', ')||'none'}\nremoved: ω = ${comps.filter(([w])=>!keep(w)).map(c=>c[0]).join(', ')||'none'}\noutput y(t) = ${out.join(' + ')||'0'}`;
  }
  ['#c1','#c2'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('l1',[
   {q:'Same input, ideal <b>lowpass</b> with cutoff 5. What comes out?',o:['1 + cos(2t)','0.8cos(7t) + 0.6cos(15t)','1','everything'],a:0,e:'Lowpass keeps ω below 5: the constant (ω = 0) and cos(2t).'},
   {q:'Ideal <b>bandpass</b> from 5 to 10. Which wave survives?',o:['ω = 2','ω = 7','ω = 15','none'],a:1,e:'Only 7 sits between 5 and 10.'},
   {q:'A gain of |H| = 0.5 at ω = 7 does what to 0.8cos(7t)?',o:['deletes it','makes it 0.4cos(7t)','doubles it','changes its frequency'],a:1,e:'Gain multiplies the amplitude: 0.8 × 0.5 = 0.4. The frequency never changes.'}]));
}});

/* 2. Why ideal is impossible */
L.push({t:'Nonideal Filters: Linear Phase and Causality',s:'6.2',k:'6.2a',build(el){
  el.innerHTML=`<div class="rule">h(t) = (ωc/π)·sinc[ωc(t − t_d)/π]   →   h(t) ≠ 0 for t &lt; 0   →   non-causal   →   cannot be built</div>
  <p class="try"><b>Try:</b> push the delay t_d up to make it "more causal". The red part shrinks but never reaches zero. The phase line, −ω·t_d, only sets that delay.</p>
  <div class="controls">
    <div class="ctl"><label for="td">Delay t_d</label><input id="td" type="range" min="0" max="12" step="0.5" value="3"><output id="tdo"></output></div>
    <div class="ctl"><label for="wc2">Cutoff ωc</label><input id="wc2" type="range" min="0.5" max="4" step="0.1" value="1.5"><output id="wc2o"></output></div>
  </div>
  <div class="scope"><figure><figcaption>Impulse response h(t). Red zone = before the input arrives</figcaption><canvas id="s2a"></canvas></figure>
  <figure><figcaption>Phase of the ideal filter: a straight line, slope −t_d (just a delay)</figcaption><canvas id="s2b"></canvas></figure></div>
  <div class="readout" id="r2"></div>`;
  function draw(){
    const td=+$('#td').value,wc=+$('#wc2').value;$('#tdo').textContent=td+' s';$('#wc2o').textContent=wc+' rad/s';
    const h=t=>{const u=wc*(t-td);return Math.abs(u)<1e-9?wc/Math.PI:Math.sin(u)/(Math.PI*(t-td));};
    const P=axes($('#s2a'),[-10,22],[-0.35*wc/Math.PI,1.15*wc/Math.PI],{xt:[[-10,'-10'],[0,'0'],[10,'10'],[20,'20']],yt:[[0,'0']],xl:'t'});
    P.g.fillStyle=css('--warn');P.g.globalAlpha=.12;P.g.fillRect(P.X(-10),P.T,P.X(0)-P.X(-10),P.h-P.T-P.B);P.g.globalAlpha=1;
    line(P,h,-10,22,css('--accent'),2,1200);label(P,td,1.05*wc/Math.PI,' peak at t_d',css('--ink'));
    let before=0,all=0;for(let t=-400;t<400;t+=0.01){const v=Math.abs(h(t))*0.01;all+=v;if(t<0)before+=v;}
    const Q=axes($('#s2b'),[-4,4],[-12,12],{xt:[[-4,'-4'],[0,'0'],[4,'4 ω']],yt:[[0,'0']]});
    line(Q,w=>Math.abs(w)<wc?-w*td:NaN,-wc,wc,css('--accent'),2.5,300);
    $('#r2').innerHTML=`share of h(t) that comes before t = 0: <span class="bad">${(100*before/all).toFixed(1)}%</span>  (never 0, so the filter is non-causal)\nlinear phase −ω·t_d  →  output = input delayed by ${td} s, same shape`;
  }
  ['#td','#wc2'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('l2',[
   {q:'Why can\'t an ideal lowpass filter be built?',o:['Its gain is too large','Its h(t) is nonzero for t &lt; 0, so it is non-causal','It has no phase','It needs negative frequencies'],a:1,e:'A sinc impulse response starts before t = 0; real systems need h(t) = 0 for t &lt; 0.'},
   {q:'A filter has |H| = 1 and ∠H = −2ω in its passband. A signal in the passband comes out…',o:['the same shape, 2 s later','twice as big','with its frequency doubled','distorted'],a:0,e:'Linear phase −ω·t_d is a pure delay of t_d = 2 s, with no distortion.'}]));
}});

/* 3. Real specs: the mask */
L.push({t:'Nonideal Filters: Realizable Specifications',s:'6.2',k:'6.2b',build(el){
  el.innerHTML=`<div class="rule">passband |ω| ≤ ω_p : 1−δ₁ ≤ |H| ≤ 1+δ₁      stopband |ω| ≥ ω_s : |H| ≤ δ₂      in between: no rule</div>
  <p class="try"><b>Try:</b> move the transition band narrower (ω_s closer to ω_p). The same filter starts failing. That is why sharper specs cost more.</p>
  <div class="controls">
    <div class="ctl"><label for="wp3">ω_p</label><input id="wp3" type="range" min="0.4" max="1.6" step="0.05" value="1"><output id="wp3o"></output></div>
    <div class="ctl"><label for="ws3">ω_s</label><input id="ws3" type="range" min="1.1" max="4" step="0.05" value="3"><output id="ws3o"></output></div>
    <div class="ctl"><label for="d13">δ₁</label><input id="d13" type="range" min="0.02" max="0.3" step="0.01" value="0.1"><output id="d13o"></output></div>
    <div class="ctl"><label for="d23">δ₂</label><input id="d23" type="range" min="0.01" max="0.3" step="0.01" value="0.1"><output id="d23o"></output></div>
  </div>
  <div class="scope"><figure><figcaption>Blue curve: a fixed 3rd-order filter (cutoff 1.3). Green = allowed, red = forbidden</figcaption><canvas id="s3" style="height:260px"></canvas></figure></div>
  <div class="readout" id="r3"></div>`;
  function draw(){
    let wp=+$('#wp3').value,ws=+$('#ws3').value;if(ws<=wp+0.05){ws=wp+0.05;$('#ws3').value=ws;}const d1=+$('#d13').value,d2=+$('#d23').value;
    $('#wp3o').textContent=wp;$('#ws3o').textContent=ws;$('#d13o').textContent=d1;$('#d23o').textContent=d2;
    const H=w=>1/Math.sqrt(1+Math.pow(w/1.3,6));
    const P=axes($('#s3'),[0,4.5],[0,1.4],{xt:[[wp,'ω_p'],[ws,'ω_s']],yt:[[0,'0'],[1,'1']],xl:'ω'});
    const box=(x0,x1,y0,y1,c,a)=>{P.g.fillStyle=c;P.g.globalAlpha=a;P.g.fillRect(P.X(x0),P.Y(y1),P.X(x1)-P.X(x0),P.Y(y0)-P.Y(y1));P.g.globalAlpha=1;};
    box(0,wp,1-d1,1+d1,css('--keep'),.22);box(ws,4.5,0,d2,css('--keep'),.22);

L.push({t:'Systematic Filter Design',s:'6.4',k:'6.4',build(el){

    const ks=[];for(let k=1;k<=N;k++){const a=(2*k+N-1)*Math.PI/(2*N);ks.push([k,a,Math.cos(a),Math.sin(a)]);}
    P.g.strokeStyle=css('--warn');P.g.lineWidth=2.5;ks.forEach(([k,a,x,y])=>{const X=P.X(x),Y=P.Y(y);P.g.beginPath();P.g.moveTo(X-6,Y-6);P.g.lineTo(X+6,Y+6);P.g.moveTo(X+6,Y-6);P.g.lineTo(X-6,Y+6);P.g.stroke();label(P,x,y+0.12,'s'+k,css('--ink'),'center');});

L.push({t:'Design through Transformations',s:'6.4.2',k:'6.4.2a',build(el){

/* 5. Butterworth and choosing N */
L.push({t:'Design: Solving for G, ω₀ and N',s:'6.4.2',k:'6.4.2b',build(el){
  el.innerHTML=`<div class="rule">|H| = G / √(1 + (ω/ω₀)^(2N))      at ω = ω₀: |H| = G/√2 for every N      (highpass: use ω₀/ω instead)</div>
  <p class="try"><b>Try:</b> type a spec, read the steps, then set the N slider to the answer and watch the curve go green. Drop N by one and it fails.</p>
  <div class="controls">
    <div class="ctl"><label for="g1">Passband: |H| ≥</label><input id="g1" type="number" step="0.01" min="0.5" max="0.99" value="0.9"></div>
    <div class="ctl"><label for="wp5">at ω_p =</label><input id="wp5" type="number" step="10" min="1" value="1000"></div>
    <div class="ctl"><label for="ds">Stopband: |H| ≤</label><input id="ds" type="number" step="0.01" min="0.001" max="0.5" value="0.1"></div>
    <div class="ctl"><label for="ws5">at ω_s =</label><input id="ws5" type="number" step="10" min="2" value="3000"></div>
  </div>
  <div class="readout" id="r5a"></div>
  <div class="controls">
    <div class="ctl"><label for="N5">Order N</label><input id="N5" type="range" min="1" max="10" step="1" value="2"><output id="N5o"></output></div>
    <div class="ctl"><label for="w05">Cutoff ω₀</label><input id="w05" type="range" min="200" max="3000" step="5" value="1330"><output id="w05o"></output></div>
  </div>
  <div class="scope"><figure><figcaption>Your filter against the spec (green boxes = must pass through)</figcaption><canvas id="s5" style="height:260px"></canvas></figure></div>
  <div class="readout" id="r5b"></div>`;
  function draw(){
    const G=1,G1=+$('#g1').value,wp=+$('#wp5').value,ds=+$('#ds').value,ws=+$('#ws5').value;
    const ok=G1>0&&G1<1&&ds>0&&ds<G1&&ws>wp&&wp>0;
    if(!ok){$('#r5a').innerHTML='<span class="bad">Check the spec: need 0 &lt; stopband limit &lt; passband limit &lt; 1 and ω_s &gt; ω_p.</span>';return;}
    const a=sq(G/G1)-1,b=sq(G/ds)-1,Nr=Math.log(b/a)/(2*Math.log(ws/wp)),N=Math.ceil(Nr-1e-12),lo=wp*Math.pow(a,-1/(2*N)),hi=ws*Math.pow(b,-1/(2*N));
    $('#r5a').innerHTML=`step 1  α = (1/${G1})² − 1 = ${fmt(a,4)}\nstep 2  β = (1/${ds})² − 1 = ${fmt(b,2)}\nstep 3  N ≥ ln(β/α) / (2·ln(ω_s/ω_p)) = ln(${fmt(b/a,1)}) / (2·ln(${fmt(ws/wp,3)})) = ${fmt(Nr,3)}  →  round UP  →  <span class="ok">N = ${N}</span>\nstep 4  ω₀ between ω_p·α^(−1/2N) = ${fmt(lo,1)} and ω_s·β^(−1/2N) = ${fmt(hi,1)}`;
    const Ns=+$('#N5').value;const w0s=$('#w05');w0s.min=Math.round(wp*0.4);w0s.max=Math.round(ws*1.2);const w0=+w0s.value;$('#N5o').textContent='N = '+Ns;$('#w05o').textContent=w0+' rad/s';
    const H=w=>1/Math.sqrt(1+Math.pow(w/w0,2*Ns)),xm=ws*1.6;
    const P=axes($('#s5'),[0,xm],[0,1.15],{xt:[[wp,'ω_p'],[ws,'ω_s'],[w0,'ω₀']],yt:[[0,'0'],[1/Math.SQRT2,'.707'],[1,'1']],xl:'ω'});
    const box=(x0,x1,y0,y1,c,al)=>{P.g.fillStyle=c;P.g.globalAlpha=al;P.g.fillRect(P.X(x0),P.Y(y1),P.X(x1)-P.X(x0),P.Y(y0)-P.Y(y1));P.g.globalAlpha=1;};
    box(0,wp,G1,1.05,css('--keep'),.2);box(ws,xm,0,ds,css('--keep'),.2);box(0,wp,0,G1,css('--warn'),.1);box(ws,xm,ds,1.15,css('--warn'),.1);
    line(P,w=>w<w0*1.0?(w<w0?1:0):0,0,xm,css('--drop'),1,600,[4,4]);
    const pOK=H(wp)>=G1-1e-9,sOK=H(ws)<=ds+1e-9;line(P,H,0,xm,pOK&&sOK?css('--keep'):css('--accent'),2.5,600);
    $('#r5b').innerHTML=`|H(ω_p)| = 1/√(1 + (${wp}/${w0})^${2*Ns}) = ${fmt(H(wp),4)}  ${pOK?'<span class="ok">≥ '+G1+' PASS</span>':'<span class="bad">&lt; '+G1+' FAIL</span>'}\n|H(ω_s)| = 1/√(1 + (${ws}/${w0})^${2*Ns}) = ${fmt(H(ws),4)}  ${sOK?'<span class="ok">≤ '+ds+' PASS</span>':'<span class="bad">&gt; '+ds+' FAIL</span>'}`;
  }
  ['#g1','#wp5','#ds','#ws5','#N5','#w05'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('l5',[
   {q:'Butterworth prototype (ω₀ = 1), N = 2. What is |H| at ω = 3?',o:['1/√10 ≈ 0.32','1/√82 ≈ 0.11','1/3','0'],a:1,e:'1/√(1 + 3⁴) = 1/√(1 + 81) = 1/√82 ≈ 0.11.'},
   {q:'At its cutoff ω = ω₀, a Butterworth filter of any order has gain…',o:['1','0.707 (−3 dB)','0.5','depends on N'],a:1,e:'(ω₀/ω₀)^(2N) = 1 for every N, so |H| = 1/√2.'},
   {q:'The formula gives N ≥ 2.1. You choose…',o:['N = 2','N = 2.1','N = 3','N = 21'],a:2,e:'N must be a whole number and must satisfy N ≥ 2.1, so round up to 3.'},
   {q:'How do you turn the lowpass into a highpass with cutoff ω₀?',o:['replace ω by ω/ω₀','replace ω by ω₀/ω','use 1 − |H|','double N'],a:1,e:'ω → ω₀/ω flips the curve: low ω now gives a huge ratio (gain ≈ 0), high ω gives ≈ 1.'}]));
}});

/* 6. Bandwidth */
L.push({t:'Measures of Bandwidth',s:'6.5',k:'6.5',build(el){
  el.innerHTML=`<div class="rule">NE = ∫₀^∞|X|²dω / |X(0)|²        RMS = √( ∫₀^∞ ω²|X|²dω / ∫₀^∞|X|²dω )</div>
  <p class="try"><b>Try:</b> switch spectra. The triangle is Problem 6 from your sample midterm.</p>
  <div class="controls"><div class="ctl"><label>Spectrum |X(jω)|</label><div class="seg" id="sp"><button aria-pressed="true" data-v="tri">Triangle 2 − |ω|</button><button data-v="rc">RC: 1/√(1+ω²)</button><button data-v="rect">Ideal: 1 for |ω| &lt; 1.5</button></div></div></div>
  <div class="scope"><figure><figcaption>Blue: |X|. Markers: the four bandwidths. Green box: the noise-equivalent rectangle</figcaption><canvas id="s6" style="height:260px"></canvas></figure></div>
  <div class="readout" id="r6"></div>`;
  let kind='tri';el.querySelectorAll('#sp button').forEach(b=>b.onclick=()=>{kind=b.dataset.v;el.querySelectorAll('#sp button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
  function draw(){
    const X=kind==='tri'?w=>Math.max(0,2-w):kind==='rc'?w=>1/Math.sqrt(1+w*w):w=>w<1.5?1:0;
    const abs=kind==='tri'?2:kind==='rc'?Infinity:1.5;
    const t3=kind==='tri'?2-Math.SQRT2:kind==='rc'?1:1.5;
    const ne=kind==='tri'?2/3:kind==='rc'?Math.PI/2:1.5;
    const rms=kind==='tri'?Math.sqrt(0.4):kind==='rc'?Infinity:1.5/Math.sqrt(3);
    const xm=kind==='rc'?5:3;
    const P=axes($('#s6'),[0,xm],[0,1.25*X(0)],{xt:[[0,'0'],[1,'1'],[2,'2'],[3,'3']].filter(v=>v[0]<=xm),yt:[[0,'0'],[X(0),fmt(X(0))],[X(0)/Math.SQRT2,'.707·peak']],xl:'ω'});
    P.g.fillStyle=css('--keep');P.g.globalAlpha=.15;P.g.fillRect(P.X(0),P.Y(X(0)),P.X(ne)-P.X(0),P.Y(0)-P.Y(X(0)));P.g.globalAlpha=1;
    line(P,X,0,xm,css('--accent'),2.5,800);
    const mark=(v,lab,yy)=>{if(!isFinite(v)||v>xm)return;P.g.strokeStyle=css('--ink');P.g.setLineDash([3,3]);P.g.beginPath();P.g.moveTo(P.X(v),P.Y(0));P.g.lineTo(P.X(v),P.Y(yy));P.g.stroke();P.g.setLineDash([]);label(P,v,yy,' '+lab,css('--ink'));};
    mark(t3,'3 dB',X(0)*1.08);mark(ne,'NE',X(0)*0.95);mark(rms,'RMS',X(0)*0.8);mark(abs,'abs',X(0)*0.3);
    const why=kind==='tri'?`3 dB : 2 − ω = 2/√2  →  ω = 2 − √2\nNE   : ∫₀²(2−ω)²dω / 2² = (8/3)/4\nRMS  : √( (16/15) / (8/3) ) = √0.4`:kind==='rc'?`3 dB : 1/(1+ω²) = 1/2  →  ω = 1\nNE   : ∫₀^∞ dω/(1+ω²) / 1 = π/2\nRMS  : ∫ω²/(1+ω²) diverges  →  ∞\nabs  : never exactly 0  →  ∞`:`flat until 1.5, then 0: abs = 3 dB = NE = 1.5\nRMS  : √( (1.5³/3) / 1.5 ) = 1.5/√3`;
    $('#r6').innerHTML=`absolute = ${fmt(abs)}     3 dB = ${fmt(t3)}     noise-eq = ${fmt(ne)}     RMS = ${fmt(rms)}   (rad/s)\n\n${why}`;
  }
  draw();this.draw=draw;
  el.appendChild(quiz('l6',[
   {q:'Triangle X = 2 − |ω| for |ω| &lt; 2. Its absolute bandwidth is…',o:['1','2','2 − √2','4'],a:1,e:'It first reaches exactly 0 at ω = 2.'},
   {q:'Same triangle. Its 3 dB bandwidth is…',o:['√2','2 − √2 ≈ 0.59','1','2/√2'],a:1,e:'Solve 2 − ω = 2/√2 = √2, so ω = 2 − √2. (Option (c) on the sample midterm is the trap √2.)'},
   {q:'Multiply x(t) by cos(2πt). The new absolute bandwidth of the triangle signal is…',o:['2','4','2π','unchanged'],a:1,e:'Modulation moves the whole triangle (−2 to 2) out to ±2π, so each copy is 4 wide: bandwidth doubles.'}]));
}});

/* ---------- shell ---------- */
let cur=0;
function show(i){
  cur=i;const nav=$('#nav');nav.querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
  const m=$('#main');m.innerHTML='';const sec=document.createElement('section');sec.className='lesson';
  sec.innerHTML=`<div><div class="eyebrow">Notes §${L[i].s} · page ${i+1} of ${L.length}</div><h2>${L[i].s} ${L[i].t}</h2></div><details class="notes" open><summary>From the notes · §${L[i].s}</summary>${NOTES[L[i].k]||''}</details>`;
  const body=document.createElement('div');body.style.display='flex';body.style.flexDirection='column';body.style.gap='16px';sec.appendChild(body);m.appendChild(sec);
  L[i].build.call(L[i],body);
  const nr=document.createElement('div');nr.className='navrow';
  nr.innerHTML=`<button type="button" id="prev" ${i?'':'hidden'}>← ${i?L[i-1].t:''}</button><span class="score" id="score"></span><button type="button" class="next" id="next" ${i<L.length-1?'':'hidden'}>${i<L.length-1?L[i+1].t+' →':''}</button>`;
  sec.appendChild(nr);$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);updScore();
  try{localStorage.setItem('ch6lab',i)}catch(e){}
}
function go(i){location.hash='lesson'+(i+1);}
function fromHash(){const m=/lesson(\d+)/.exec(location.hash);let i=m?+m[1]-1:0;if(!m){try{i=+(localStorage.getItem('ch6lab')||0)}catch(e){}}show(Math.min(Math.max(i,0),L.length-1));window.scrollTo({top:0});}
L.forEach((l,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span class="n">${l.s}</span><span>${l.t}</span>`;b.onclick=()=>go(i);$('#nav').appendChild(b);});
window.addEventListener('hashchange',fromHash);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>L[cur].draw&&L[cur].draw(),120);});
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>L[cur].draw&&L[cur].draw());
new MutationObserver(()=>L[cur].draw&&L[cur].draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts&&document.fonts.ready.then(()=>L[cur].draw&&L[cur].draw());
fromHash();
</script>
