<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a bench instrument. Left rail of six lessons, right panel = one lesson: idea, live scope, check questions. */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --ink:#14212b; --muted:#5b6b75; --line:#d5dee3;
  --accent:#5b47b8; --accent-soft:#ebe7fa; --keep:#1f8a4c; --drop:#b9c4ca; --warn:#c2412d; --trace:#14212b; --grid:#e7edf0;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1519; --panel:#142027; --ink:#e3ecef; --muted:#93a6af; --line:#24343c;
  --accent:#a593ff; --accent-soft:#2a2547; --keep:#4fd08a; --drop:#3a4a52; --warn:#ff7a62; --trace:#e3ecef; --grid:#1c2a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1519; --panel:#142027; --ink:#e3ecef; --muted:#93a6af; --line:#24343c;
  --accent:#a593ff; --accent-soft:#2a2547; --keep:#4fd08a; --drop:#3a4a52; --warn:#ff7a62; --trace:#e3ecef; --grid:#1c2a31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-family:var(--f-display);font-size:28px;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:68ch}
nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:8px;border:1px solid transparent;color:var(--muted);white-space:nowrap}
nav button .n{font-family:var(--f-mono);font-size:12px}
nav button:hover{color:var(--ink);background:var(--panel)}
nav button[aria-current="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--f-display);font-size:24px;margin:2px 0 0;text-wrap:balance}
.idea{max-width:70ch;margin:0}
.idea b{color:var(--ink)}
.rule{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-family:var(--f-mono);font-size:14px;overflow-x:auto}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:150px}
.ctl label{font-size:12.5px;color:var(--muted);font-weight:500}
.ctl output{font-family:var(--f-mono);font-size:14px}
input[type=range]{width:170px;accent-color:var(--accent)}
select,input[type=number]{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:120px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel);font-weight:600}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.scope figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;background:var(--bg);min-width:0}
.scope figcaption{font-size:12px;color:var(--muted);margin-bottom:4px}
canvas{width:100%;height:220px;display:block}
.readout{font-family:var(--f-mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;overflow-x:auto;white-space:pre-wrap}
.readout .ok{color:var(--keep);font-weight:600}.readout .bad{color:var(--warn);font-weight:600}

.try b{color:var(--ink)}
.quiz{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px}
.quiz h3{font-family:var(--f-display);font-size:16px;margin:0}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{all:unset;cursor:pointer;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg)}

.fb.right{color:var(--keep)}.fb.wrong{color:var(--warn)}
.navrow{display:flex;justify-content:space-between;gap:10px}
.navrow button{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;border:1px solid var(--line);font-weight:500}
.navrow button.next{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.score{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.home{display:inline-block;margin-bottom:8px;color:var(--accent);text-decoration:none;font-weight:500}.home:hover{text-decoration:underline}
:root{color-scheme:light}body{margin:0}
</style>

</head><body>
<div class="wrap">
<header><a class="home" href="../">← All chapters</a>
  <h1>Chapter 7 AM Lab</h1>
  <p>Six short lessons on amplitude modulation, one per idea in your notes. Read the idea, move the sliders, sketch the spectrum in your head, then answer the check questions. Companion to the Chapter 6 Filter Lab.</p>
</header>
<nav id="nav" aria-label="Lessons"></nav>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(x,d=3)=>!isFinite(x)?"∞":(Math.abs(x)<1e-9?"0":(+x.toFixed(d)).toString());
const sq=x=>x*x;

/* ---------- canvas plotting ---------- */
function setup(c){const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(10,r.width*dpr);c.height=Math.max(10,r.height*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return{g,w:r.width,h:r.height};}
function axes(c,xr,yr,o={}){
  const {g,w,h}=setup(c);const L=o.left??38,R=10,T=10,B=o.bottom??24;
  const X=x=>L+(x-xr[0])/(xr[1]-xr[0])*(w-L-R), Y=y=>h-B-(y-yr[0])/(yr[1]-yr[0])*(h-T-B);
  g.font='11px "JetBrains Mono",monospace';g.fillStyle=css('--muted');g.strokeStyle=css('--grid');g.lineWidth=1;
  (o.xt||[]).forEach(([v,l])=>{g.beginPath();g.moveTo(X(v),T);g.lineTo(X(v),h-B);g.stroke();g.textAlign='center';g.fillText(l,X(v),h-B+14);});
  (o.yt||[]).forEach(([v,l])=>{g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.textAlign='right';g.fillText(l,L-5,Y(v)+4);});
  g.strokeStyle=css('--muted');g.beginPath();g.moveTo(L,T);g.lineTo(L,h-B);g.lineTo(w-R,h-B);g.stroke();
  if(o.xl){g.textAlign='right';g.fillText(o.xl,w-R,h-B-5);}
  return{g,X,Y,w,h,L,R,T,B};
}
function line(P,f,x0,x1,col,lw=2,n=500,dash){const{g,X,Y}=P;g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));}g.stroke();g.setLineDash([]);}
function stick(P,x,y,col){const{g,X,Y}=P;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=3;g.beginPath();g.moveTo(X(x),Y(0));g.lineTo(X(x),Y(y));g.stroke();g.beginPath();g.arc(X(x),Y(y),4.5,0,7);g.fill();}
function label(P,x,y,t,col,align='left'){P.g.fillStyle=col;P.g.textAlign=align;P.g.font='12px "JetBrains Mono",monospace';P.g.fillText(t,P.X(x),P.Y(y));}

/* ---------- quiz helper ---------- */
const score={};
function quiz(id,items){
  const box=document.createElement('div');box.className='quiz';box.innerHTML='<h3>Check yourself</h3>';
  items.forEach((it,qi)=>{const q=document.createElement('div');q.className='q';q.innerHTML=`<p>${qi+1}. ${it.q}</p>`;const opts=document.createElement('div');opts.className='opts';const fb=document.createElement('div');fb.className='fb';
    it.o.forEach((t,oi)=>{const b=document.createElement('button');b.type='button';b.innerHTML=t;b.onclick=()=>{
      opts.querySelectorAll('button').forEach(x=>x.classList.remove('right','wrong'));
      const ok=oi===it.a;b.classList.add(ok?'right':'wrong');fb.className='fb '+(ok?'right':'wrong');
      fb.innerHTML=(ok?'Right. ':'Not quite. ')+it.e;score[id+qi]=ok;updScore();};opts.appendChild(b);});
    q.append(opts,fb);box.appendChild(q);});
  return box;
}
function updScore(){const v=Object.values(score);const el=$('#score');if(el)el.textContent=`${v.filter(Boolean).length} correct so far`;}

/* ---------- lessons ---------- */
const L=[];
const msg=t=>0.7*Math.cos(t)+0.4*Math.cos(2.3*t);           // message x(t), goes negative
const tri=(w,B)=>Math.max(0,1-Math.abs(w)/B);                 // baseband spectrum shape
function bandShape(P,c,B,h,col,alpha=0.25){const{g,X,Y}=P;g.fillStyle=col;g.globalAlpha=alpha;g.beginPath();g.moveTo(X(c-B),Y(0));g.lineTo(X(c),Y(h));g.lineTo(X(c+B),Y(0));g.closePath();g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=2;g.stroke();}
function arrow(P,x,h,col){const{g,X,Y}=P;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2.5;g.beginPath();g.moveTo(X(x),Y(0));g.lineTo(X(x),Y(h));g.stroke();g.beginPath();g.moveTo(X(x),Y(h)-6);g.lineTo(X(x)-4,Y(h)+2);g.lineTo(X(x)+4,Y(h)+2);g.closePath();g.fill();}

/* 1. Why modulate */
L.push({t:'Why modulate',s:'7.1',build(el){
  el.innerHTML=`<p class="idea">Audio sits at low frequencies (up to about 5 kHz). To send it through the air you need an antenna about as long as one wavelength, <b>λ = c/f</b>. At audio frequencies that is kilometres long. <b>Modulation</b> moves the audio up to a high carrier frequency, where the antenna is small, and lets many stations share the air by using different carriers.</p>
  <div class="rule">λ = c / f,   c = 3×10⁸ m/s     three reasons: antenna size · propagation · multiple access (each station its own carrier)</div>
  <p class="try"><b>Try:</b> slide the frequency from audio up to AM radio and watch the antenna shrink.</p>
  <div class="controls"><div class="ctl"><label for="f1">Frequency f</label><input id="f1" type="range" min="2" max="7" step="0.05" value="3.7"><output id="f1o"></output></div></div>
  <div class="scope"><figure><figcaption>Antenna length needed (log scale) compared with familiar sizes</figcaption><canvas id="a1"></canvas></figure></div>
  <div class="readout" id="r1"></div>`;
  function draw(){
    const lf=+$('#f1').value,f=Math.pow(10,lf),lam=3e8/f;$('#f1o').textContent=f>=1e6?fmt(f/1e6,2)+' MHz':f>=1e3?fmt(f/1e3,1)+' kHz':fmt(f,0)+' Hz';
    const P=axes($('#a1'),[0,7],[0,1],{xt:[[0,'1 m'],[1,'10 m'],[2,'100 m'],[3,'1 km'],[4,'10 km'],[5,'100 km'],[6,'1000 km']],yt:[],left:12});
    const refs=[[Math.log10(1.8),'person'],[Math.log10(330),'Eiffel Tower'],[Math.log10(8849),'Everest'],[Math.log10(60000),'5 kHz audio']];
    refs.forEach(([x,t],i)=>{P.g.strokeStyle=css('--drop');P.g.beginPath();P.g.moveTo(P.X(x),P.Y(0));P.g.lineTo(P.X(x),P.Y(0.25+0.15*i));P.g.stroke();label(P,x,0.27+0.15*i,' '+t,css('--muted'));});
    const x=Math.log10(lam);P.g.fillStyle=css('--accent');P.g.fillRect(P.X(0),P.Y(0.95),Math.max(2,P.X(Math.min(7,Math.max(0,x)))-P.X(0)),14);
    $('#r1').innerHTML=`λ = 3×10⁸ / ${fmt(f,0)} = ${lam>=1000?fmt(lam/1000,2)+' km':fmt(lam,1)+' m'}\n${lam>20000?'<span class="bad">far too long to build</span>':lam>1000?'still huge':'<span class="ok">buildable</span>'}`;
  }
  $('#f1').oninput=draw;draw();this.draw=draw;
  el.appendChild(quiz('m1',[
   {q:'Why can\'t you transmit 5 kHz audio directly?',o:['It is too loud','The antenna would need to be about 60 km long','Audio has no frequency','Air blocks all low frequencies'],a:1,e:'λ = 3×10⁸ / 5×10³ = 60 000 m. At 1 MHz it is 300 m.'},
   {q:'How do many radio stations avoid interfering with each other?',o:['They take turns','Each uses its own carrier frequency','They use different volumes','They use different antennas only'],a:1,e:'Multiple access: each station is moved to its own slot in frequency, and the receiver filters out the one it wants.'}]));
}});

/* 2. SC-AM */
L.push({t:'SC-AM: multiply by a carrier',s:'7.2',build(el){
  el.innerHTML=`<p class="idea">Suppressed-carrier AM just multiplies the message by a fast cosine: <b>y(t) = A·x(t)·cos(ω_c t)</b>. In frequency, the modulation property copies the message spectrum to <b>±ω_c</b> at <b>half height</b>. The width doubles to 2ω_B because each copy has both a lower and an upper sideband.</p>
  <div class="rule">Y(jω) = (A/2)[X(j(ω−ω_c)) + X(j(ω+ω_c))]      bandwidth = 2ω_B      envelope = |x(t)|, not x(t)</div>
  <p class="try"><b>Try:</b> raise ω_c and watch the copies slide right. In the time plot, look where x(t) goes negative: the envelope flips up, so an envelope detector would get |x|, not x.</p>
  <div class="controls">
    <div class="ctl"><label for="wc2">Carrier ω_c</label><input id="wc2" type="range" min="8" max="40" step="1" value="20"><output id="wc2o"></output></div>
    <div class="ctl"><label for="wb2">Message bandwidth ω_B</label><input id="wb2" type="range" min="1" max="6" step="0.5" value="3"><output id="wb2o"></output></div>
  </div>
  <div class="scope"><figure><figcaption>Frequency: message (grey, at 0) and modulated copies at ±ω_c (positive side shown)</figcaption><canvas id="b1"></canvas></figure>
  <figure><figcaption>Time: y(t) = x(t)cos(ω_c t), with x(t) dashed and |x(t)| in red</figcaption><canvas id="b2"></canvas></figure></div>
  <div class="readout" id="r2"></div>`;
  function draw(){
    const wc=+$('#wc2').value,B=+$('#wb2').value;$('#wc2o').textContent=wc+' rad/s';$('#wb2o').textContent=B+' rad/s';
    const P=axes($('#b1'),[0,48],[0,1.2],{xt:[[0,'0'],[B,'ω_B'],[wc,'ω_c'],[48,'ω']],yt:[[0,'0'],[0.5,'½'],[1,'1']]});
    bandShape(P,0,B,1,css('--drop'),.3);bandShape(P,wc,B,0.5,css('--accent'),.25);
    P.g.strokeStyle=css('--muted');P.g.setLineDash([3,3]);[wc-B,wc+B].forEach(v=>{P.g.beginPath();P.g.moveTo(P.X(v),P.Y(0));P.g.lineTo(P.X(v),P.Y(0.7));P.g.stroke();});P.g.setLineDash([]);
    label(P,wc,0.78,'2ω_B wide',css('--ink'),'center');
    const Q=axes($('#b2'),[0,12],[-1.3,1.3],{xt:[[0,'0'],[6,'6'],[12,'12']],yt:[[0,'0'],[1,'1'],[-1,'-1']],xl:'t'});
    line(Q,t=>msg(t)*Math.cos(wc*t),0,12,css('--accent'),1.2,2400);line(Q,msg,0,12,css('--muted'),1.5,600,[5,4]);line(Q,t=>Math.abs(msg(t)),0,12,css('--warn'),2,600);
    $('#r2').innerHTML=`copies centred at ±${wc} rad/s, height ½ of the original\noccupied band: ${wc-B} to ${wc+B} rad/s  →  width 2ω_B = ${2*B} rad/s`;
  }
  ['#wc2','#wb2'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('m2',[
   {q:'Audio bandlimited to 4 kHz is sent with SC-AM on a 100 kHz carrier. What band does it occupy (positive side)?',o:['0 to 4 kHz','96 to 104 kHz','100 to 104 kHz','100 to 108 kHz'],a:1,e:'The copy is centred at 100 kHz and spans ±4 kHz around it, so 8 kHz wide.'},
   {q:'Compared with the message, each modulated copy is…',o:['twice as tall','the same height','half as tall','unchanged'],a:2,e:'cos = ½(e^{jω_c t} + e^{−jω_c t}), so each copy gets a factor ½ (times A).'},
   {q:'Why can\'t an envelope detector recover x(t) from SC-AM?',o:['The carrier is too fast','The envelope is |x(t)|, so negative parts get flipped','There is no envelope','It can, always'],a:1,e:'Wherever x(t) &lt; 0 the envelope still follows |x(t)|, so the sign is lost.'}]));
}});

/* 3. Coherent demodulation */
L.push({t:'Coherent demodulation',s:'7.3',build(el){
  el.innerHTML=`<p class="idea">To get x(t) back, multiply the received signal by the <b>same</b> cosine again, then lowpass filter. Multiplying shifts the copies by ±ω_c once more: one lands back at 0 (that is the message) and one lands at ±2ω_c (the LPF throws it away). If the receiver's cosine is off by a phase φ, the message comes out scaled by <b>cos φ</b>.</p>
  <div class="rule">z = B·x·cos(ω_c t)·cos(ω_c t + φ) = (B/2)x·cos φ + (B/2)x·cos(2ω_c t + φ)   →  LPF  →  x̂ = (B/2)·x(t)·cos φ</div>
  <p class="try"><b>Try:</b> push φ toward 90°. The recovered message shrinks to nothing while the noise (grey band) stays the same. That is why the receiver must stay in sync.</p>
  <div class="controls"><div class="ctl"><label for="ph3">Phase error φ</label><input id="ph3" type="range" min="0" max="90" step="1" value="0"><output id="ph3o"></output></div></div>
  <div class="scope"><figure><figcaption>Spectrum after multiplying: copy at 0 (kept by the LPF, shaded) and copy at 2ω_c (removed)</figcaption><canvas id="c1"></canvas></figure>
  <figure><figcaption>Recovered x̂(t) (green) vs the original x(t)·B/2 (dashed); grey band = noise level</figcaption><canvas id="c2"></canvas></figure></div>
  <div class="readout" id="r3"></div>`;
  function draw(){
    const ph=+$('#ph3').value,c=Math.cos(ph*Math.PI/180),wc=20,B=3;$('#ph3o').textContent=ph+'°';
    const P=axes($('#c1'),[0,48],[0,1.2],{xt:[[0,'0'],[wc,'ω_c'],[2*wc,'2ω_c'],[48,'ω']],yt:[[0,'0'],[0.5,'½']]});
    P.g.fillStyle=css('--accent-soft');P.g.fillRect(P.X(0),P.Y(1.15),P.X(B)-P.X(0),P.Y(0)-P.Y(1.15));
    bandShape(P,0,B,0.5*Math.abs(c),css('--keep'),.3);bandShape(P,2*wc,B,0.25,css('--drop'),.3);label(P,B+.5,1.05,' LPF passband',css('--accent'));
    const Q=axes($('#c2'),[0,12],[-0.75,0.75],{xt:[[0,'0'],[6,'6'],[12,'12']],yt:[[0,'0'],[0.5,'0.5']],xl:'t'});
    Q.g.fillStyle=css('--drop');Q.g.globalAlpha=.35;Q.g.fillRect(Q.X(0),Q.Y(0.06),Q.X(12)-Q.X(0),Q.Y(-0.06)-Q.Y(0.06));Q.g.globalAlpha=1;
    line(Q,t=>0.5*msg(t),0,12,css('--muted'),1.5,600,[5,4]);line(Q,t=>0.5*c*msg(t),0,12,css('--keep'),2.5,600);
    $('#r3').innerHTML=`cos φ = cos ${ph}° = ${fmt(c,3)}\namplitude kept: ${fmt(100*c,1)}%     power kept (cos²φ): ${fmt(100*c*c,1)}%\n${ph>=80?'<span class="bad">signal is buried in the noise: amplifying does not help, it boosts noise too</span>':ph===0?'<span class="ok">perfect sync: x̂ = (B/2)·x(t)</span>':''}`;
  }
  $('#ph3').oninput=draw;draw();this.draw=draw;
  el.appendChild(quiz('m3',[
   {q:'The receiver oscillator is off by φ = 60°. The recovered message is scaled by…',o:['0','½','√3/2','1'],a:1,e:'cos 60° = ½, so the amplitude is halved (power drops to ¼).'},
   {q:'After multiplying by cos(ω_c t), where does the unwanted copy land?',o:['at 0','at ±ω_c','at ±2ω_c','nowhere'],a:2,e:'Shifting the copies at ±ω_c by ±ω_c gives 0 and ±2ω_c. The LPF keeps 0 and removes ±2ω_c.'},
   {q:'Why is coherent reception expensive?',o:['It needs a huge antenna','The receiver must track the carrier\'s exact phase','It needs two carriers','It wastes power'],a:1,e:'Keeping φ ≈ 0 requires a synchronization circuit. LC-AM avoids this.'}]));
}});

/* 4. LC-AM */
L.push({t:'LC-AM: add a big carrier',s:'7.4',build(el){
  el.innerHTML=`<p class="idea">Add a constant M before multiplying: <b>y = A[M + x(t)]cos(ω_c t)</b>. If M is at least as big as the largest negative swing of x, then M + x never goes negative, so the envelope <b>is</b> M + x. A cheap envelope detector plus a DC block gets x back with no sync. The price: power spent on the carrier carries no information.</p>
  <div class="rule">need M ≥ max|x(t)|     P_carrier = (AM)²/2   P_info = A²P_x/2   efficiency = P_x/(M² + P_x)</div>
  <p class="try"><b>Try:</b> lower M below max|x| (= 1.1 here) and watch the envelope break (red). Then raise M and watch efficiency fall.</p>
  <div class="controls"><div class="ctl"><label for="M4">Carrier level M</label><input id="M4" type="range" min="0" max="3" step="0.05" value="1.2"><output id="M4o"></output></div></div>
  <div class="scope"><figure><figcaption>Time: y(t) (thin) and the envelope a detector would follow</figcaption><canvas id="d1"></canvas></figure>
  <figure><figcaption>Spectrum: carrier impulse at ω_c (height ∝ M) plus the message sidebands</figcaption><canvas id="d2"></canvas></figure></div>
  <div class="readout" id="r4"></div>`;
  function draw(){
    const M=+$('#M4').value,wc=20,mx=1.1;$('#M4o').textContent=M;
    const P=axes($('#d1'),[0,12],[-4.3,4.3],{xt:[[0,'0'],[6,'6'],[12,'12']],yt:[[0,'0'],[M,'M']],xl:'t'});
    line(P,t=>(M+msg(t))*Math.cos(wc*t),0,12,css('--accent'),1,2400);
    line(P,t=>Math.abs(M+msg(t)),0,12,M>=mx?css('--keep'):css('--warn'),2.5,600);line(P,t=>M+msg(t),0,12,css('--muted'),1.3,600,[5,4]);
    const Q=axes($('#d2'),[0,40],[0,3.2],{xt:[[0,'0'],[wc,'ω_c'],[40,'ω']],yt:[[0,'0']]});
    bandShape(Q,wc,3,0.5,css('--accent'),.25);arrow(Q,wc,Math.max(0.05,M),css('--ink'));label(Q,wc+.6,Math.max(0.1,M)+0.05,' carrier (∝ M)',css('--ink'));
    const Px=sq(0.7)/2+sq(0.4)/2,eff=Px/(M*M+Px);
    $('#r4').innerHTML=`${M>=mx?'<span class="ok">M ≥ max|x| = 1.1: envelope = M + x(t), envelope detector works</span>':'<span class="bad">M &lt; max|x|: M + x goes negative, envelope = |M + x| is distorted</span>'}\nP_x = 0.7²/2 + 0.4²/2 = ${fmt(Px,3)}\nefficiency = P_x/(M² + P_x) = ${fmt(Px,3)}/(${fmt(M*M,3)} + ${fmt(Px,3)}) = ${fmt(100*eff,1)}%`;
  }
  $('#M4').oninput=draw;draw();this.draw=draw;
  el.appendChild(quiz('m4',[
   {q:'x(t) = 3cos(ω_m t). What is the smallest allowed M?',o:['1.5','3','4.5','9'],a:1,e:'M ≥ max|x| = 3.'},
   {q:'With x = 3cos(ω_m t) and M = 3, what fraction of power carries information?',o:['1/2','1/3','2/3','1/9'],a:1,e:'P_x = 9/2. Efficiency = 4.5/(9 + 4.5) = 1/3.'},
   {q:'What is the main advantage of LC-AM over SC-AM?',o:['Less bandwidth','Less power','Cheap receiver: envelope detector, no sync','No carrier needed'],a:2,e:'The envelope is exactly M + x, so a simple envelope detector and DC block recover x.'}]));
}});

/* 5. Superheterodyne */
L.push({t:'Superheterodyne radio',s:'7.5',build(el){
  el.innerHTML=`<p class="idea">AM radio has stations every 10 kHz from 540 to 1600 kHz. A high-quality filter that also tunes is expensive, so the receiver uses <b>one fixed filter</b> at the intermediate frequency <b>f_IF = 455 kHz</b>, and mixes with a local oscillator (LO) to move whichever station you want onto 455 kHz. The catch: a second station, the <b>image</b>, also lands on 455 kHz.</p>
  <div class="rule">low LO:  f_LO = |f_c − f_IF|,  image f_I = |f_c − 2f_IF|<br>high LO: f_LO = f_c + f_IF,   image f_I = f_c + 2f_IF</div>
  <p class="try"><b>Try:</b> tune to 1450 kHz with the low LO: the image is 540 kHz, a real station. Switch to the high LO. Then turn on the image-rejection filter.</p>
  <div class="controls">
    <div class="ctl"><label for="fc5">Desired station f_c</label><input id="fc5" type="range" min="540" max="1600" step="10" value="1450"><output id="fc5o"></output></div>
    <div class="ctl"><label for="fif5">f_IF</label><select id="fif5" style="width:auto"><option value="455" selected>455 kHz (standard)</option><option value="200">200 kHz (sample exam)</option></select></div>
    <div class="ctl"><label>LO choice</label><div class="seg" id="lo5"><button aria-pressed="true" data-v="low">Low: |f_c − f_IF|</button><button data-v="high">High: f_c + f_IF</button></div></div>
    <div class="ctl"><label>Image-rejection filter</label><div class="seg" id="irf"><button aria-pressed="true" data-v="off">Off</button><button data-v="on">On</button></div></div>
  </div>
  <div class="scope"><figure><figcaption>Before mixing (kHz): AM band 540–1600 (grey), desired station (green), image (red), LO (arrow)</figcaption><canvas id="e1" style="height:240px"></canvas></figure>
  <figure><figcaption>After mixing: what lands inside the IF filter</figcaption><canvas id="e2" style="height:240px"></canvas></figure></div>
  <div class="readout" id="r5"></div>`;
  let lo='low',irf='off';
  el.querySelectorAll('#lo5 button').forEach(b=>b.onclick=()=>{lo=b.dataset.v;el.querySelectorAll('#lo5 button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
  el.querySelectorAll('#irf button').forEach(b=>b.onclick=()=>{irf=b.dataset.v;el.querySelectorAll('#irf button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
  function draw(){
    const fc=+$('#fc5').value,fif=+$('#fif5').value;$('#fc5o').textContent=fc+' kHz';
    const flo=lo==='low'?Math.abs(fc-fif):fc+fif, fi=lo==='low'?Math.abs(fc-2*fif):fc+2*fif, inBand=fi>=540&&fi<=1600;
    const xm=3000;
    const P=axes($('#e1'),[0,xm],[0,1.3],{xt:[[0,'0'],[1000,'1000'],[2000,'2000'],[3000,'3000']],yt:[]});
    P.g.fillStyle=css('--drop');P.g.globalAlpha=.25;P.g.fillRect(P.X(540),P.Y(0.45),P.X(1600)-P.X(540),P.Y(0)-P.Y(0.45));P.g.globalAlpha=1;
    if(irf==='on'){P.g.fillStyle=css('--accent-soft');P.g.fillRect(P.X(fc-0.9*fif),P.Y(1.25),P.X(fc+0.9*fif)-P.X(fc-0.9*fif),P.Y(0)-P.Y(1.25));label(P,fc,1.18,'image-reject filter',css('--accent'),'center');}
    const showImg=inBand&&!(irf==='on'&&Math.abs(fi-fc)>0.9*fif);
    const bar=(f,h,col)=>{P.g.fillStyle=col;P.g.fillRect(P.X(f)-3,P.Y(h),6,P.Y(0)-P.Y(h));};
    bar(fc,0.8,css('--keep'));label(P,fc,0.84,'f_c '+fc,css('--keep'),'center');
    if(fi<=xm){bar(fi,0.8,inBand?(showImg?css('--warn'):css('--drop')):css('--drop'));label(P,fi,0.96,'image '+fi,showImg?css('--warn'):css('--muted'),'center');}
    arrow(P,flo,1.08,css('--ink'));label(P,flo,1.13,'LO '+flo,css('--ink'),'center');
    const Q=axes($('#e2'),[0,2*fif],[0,1.3],{xt:[[0,'0'],[fif,'f_IF = '+fif],[2*fif,'']],yt:[]});
    Q.g.fillStyle=css('--accent-soft');Q.g.fillRect(Q.X(fif-0.12*fif),Q.Y(1.25),Q.X(fif+0.12*fif)-Q.X(fif-0.12*fif),Q.Y(0)-Q.Y(1.25));
    Q.g.fillStyle=css('--keep');Q.g.fillRect(Q.X(fif)-6,Q.Y(0.8),5,Q.Y(0)-Q.Y(0.8));
    if(showImg){Q.g.fillStyle=css('--warn');Q.g.fillRect(Q.X(fif)+1,Q.Y(0.8),5,Q.Y(0)-Q.Y(0.8));label(Q,fif,0.9,'both land here!',css('--warn'),'center');}else label(Q,fif,0.9,'only the desired station',css('--keep'),'center');
    $('#r5').innerHTML=`f_LO   = ${lo==='low'?`|${fc} − ${fif}|`:`${fc} + ${fif}`} = ${flo} kHz\nimage  = ${lo==='low'?`|${fc} − 2·${fif}|`:`${fc} + 2·${fif}`} = ${fi} kHz   (always 2·f_IF = ${2*fif} kHz from f_c)\n${inBand?(showImg?'<span class="bad">image is inside 540–1600 kHz: a real station interferes</span>':'<span class="ok">image is in the band, but the image-rejection filter removes it</span>'):'<span class="ok">image is outside the AM band: no interference</span>'}`;
  }
  ['#fc5','#fif5'].forEach(s=>$(s).oninput=draw);draw();this.draw=draw;
  el.appendChild(quiz('m5',[
   {q:'f_IF = 455 kHz, low LO, desired 1520 kHz. What is f_LO?',o:['455','1065','1975','2430'],a:1,e:'f_LO = 1520 − 455 = 1065 kHz.'},
   {q:'Same station. Where is the image?',o:['610 kHz','1065 kHz','1975 kHz','2430 kHz'],a:0,e:'Image = |1520 − 910| = 610 kHz. It is inside the AM band, so it interferes unless filtered.'},
   {q:'Sample midterm: f_IF = 200 kHz, desired 720 kHz, the larger LO is chosen. f_LO and image are…',o:['520 and 320','920 and 1120','920 and 320','1120 and 920'],a:1,e:'Larger LO = 720 + 200 = 920 kHz; image = 720 + 2·200 = 1120 kHz.'},
   {q:'Why is the image-rejection filter cheap?',o:['It is not tunable','The image is 2·f_IF = 910 kHz away, so a wide, low-Q filter is enough','It uses no capacitors','It runs at audio frequency'],a:1,e:'Q ≈ f_c / bandwidth ≈ 1500/910 ≈ 1.5. Separating stations 10 kHz apart needs Q ≈ 100, which is only affordable at one fixed frequency (the IF).'}]));
}});

/* 6. QAM and SSB */
L.push({t:'QAM and SSB',s:'7.6–7.7',build(el){
  el.innerHTML=`<p class="idea">SC-AM and LC-AM waste half the bandwidth: the upper and lower sidebands carry the same information. <b>QAM</b> fixes this by sending two messages on the same carrier, one on cos and one on sin. <b>SSB</b> fixes it by filtering away one sideband. Both need a coherent receiver, and both suffer when the phase φ is off.</p>
  <div class="rule">QAM: y = A x₁cos(ω_c t) + A x₂sin(ω_c t)     x̂₁ = (A/2)(x₁cos φ − x₂sin φ)     x̂₂ = (A/2)(x₁sin φ + x₂cos φ)</div>
  <p class="try"><b>Try:</b> in QAM, raise φ and watch x₂ leak into x̂₁ (cross-talk). Switch to SSB to see one sideband removed.</p>
  <div class="controls">
    <div class="ctl"><label>Scheme</label><div class="seg" id="sch"><button aria-pressed="true" data-v="qam">QAM</button><button data-v="ssb">SSB</button></div></div>
    <div class="ctl"><label for="ph6">Phase error φ</label><input id="ph6" type="range" min="0" max="90" step="1" value="0"><output id="ph6o"></output></div>
  </div>
  <div class="scope"><figure><figcaption id="g1c">Spectrum</figcaption><canvas id="g1"></canvas></figure>
  <figure><figcaption id="g2c">Receiver output</figcaption><canvas id="g2"></canvas></figure></div>
  <div class="readout" id="r6"></div>`;
  let sch='qam';el.querySelectorAll('#sch button').forEach(b=>b.onclick=()=>{sch=b.dataset.v;el.querySelectorAll('#sch button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
  const x1=t=>Math.cos(t),x2=t=>0.8*Math.sin(2.7*t);
  function draw(){
    const ph=+$('#ph6').value,r=ph*Math.PI/180;$('#ph6o').textContent=ph+'°';const wc=20,B=3;
    const P=axes($('#g1'),[0,40],[0,1.2],{xt:[[0,'0'],[wc,'ω_c'],[40,'ω']],yt:[[0,'0']]});
    if(sch==='qam'){bandShape(P,wc,B,0.5,css('--accent'),.22);bandShape(P,wc,B,0.4,css('--keep'),.18);label(P,wc,0.6,'x₁ and x₂ share 2ω_B',css('--ink'),'center');$('#g1c').textContent='Spectrum: two messages stacked in the same band';}
    else{const{g,X,Y}=P;g.fillStyle=css('--drop');g.globalAlpha=.25;g.beginPath();g.moveTo(X(wc-B),Y(0));g.lineTo(X(wc),Y(0.5));g.lineTo(X(wc),Y(0));g.fill();g.globalAlpha=1;
      g.fillStyle=css('--accent');g.globalAlpha=.3;g.beginPath();g.moveTo(X(wc),Y(0));g.lineTo(X(wc),Y(0.5));g.lineTo(X(wc+B),Y(0));g.closePath();g.fill();g.globalAlpha=1;
      label(P,wc-B,0.62,'lower sideband removed',css('--muted'));label(P,wc+.3,0.75,' upper kept: width ω_B',css('--accent'));$('#g1c').textContent='Spectrum: only one sideband is transmitted';}
    const Q=axes($('#g2'),[0,12],[-1.2,1.2],{xt:[[0,'0'],[6,'6'],[12,'12']],yt:[[0,'0'],[1,'1']],xl:'t'});
    if(sch==='qam'){line(Q,x1,0,12,css('--muted'),1.5,600,[5,4]);line(Q,t=>x1(t)*Math.cos(r)-x2(t)*Math.sin(r),0,12,css('--accent'),2.5,600);$('#g2c').textContent='x̂₁ (blue) vs the true x₁ (dashed)';
      const P1=0.5,P2=0.32,PN=0.01,s=P1*sq(Math.cos(r))/(P2*sq(Math.sin(r))+PN);
      $('#r6').innerHTML=`x̂₁ ∝ x₁·cos ${ph}° − x₂·sin ${ph}° = ${fmt(Math.cos(r),3)}·x₁ − ${fmt(Math.sin(r),3)}·x₂\nSINR₁ = P₁cos²φ / (P₂sin²φ + P_N) = ${fmt(s,1)}  (${fmt(10*Math.log10(s),1)} dB)\n${ph===0?'<span class="ok">φ = 0: each branch gets only its own message</span>':'<span class="bad">cross-talk: x₂ leaks into x̂₁</span>'}`;}
    else{line(Q,x1,0,12,css('--muted'),1.5,600,[5,4]);line(Q,t=>Math.cos(t-r),0,12,css('--accent'),2.5,600);$('#g2c').textContent='SSB demod of x = cos t: the phase error shifts the output';
      $('#r6').innerHTML=`SSB bandwidth = ω_B (half of SC-AM)\nwith phase error φ the output is shifted/distorted, not just scaled\n${ph===0?'<span class="ok">φ = 0: exact recovery</span>':'<span class="bad">φ = '+ph+'°: output no longer matches x(t)</span>'}`;}
  }
  $('#ph6').oninput=draw;draw();this.draw=draw;
  el.appendChild(quiz('m6',[
   {q:'QAM sends two messages of bandwidth ω_B in a total bandwidth of…',o:['ω_B','2ω_B','4ω_B','ω_B/2'],a:1,e:'Both share the same 2ω_B band, so it is ω_B per message.'},
   {q:'QAM with φ = 30°. x̂₁ is proportional to…',o:['x₁','x₁·(√3/2) − x₂·(1/2)','x₂','x₁·(1/2) + x₂·(√3/2)'],a:1,e:'x̂₁ = (A/2)(x₁cos 30° − x₂sin 30°).'},
   {q:'What does SSB do differently from SC-AM?',o:['Adds a carrier','Removes one sideband, halving the bandwidth to ω_B','Uses two carriers','Needs no receiver'],a:1,e:'The two sidebands of a real signal carry the same information, so one is filtered away.'}]));
}});
/* ---------- shell ---------- */
let cur=0;
function show(i){
  cur=i;const nav=$('#nav');nav.querySelectorAll('button').forEach((b,k)=>b.setAttribute('aria-current',k===i));
  const m=$('#main');m.innerHTML='';const sec=document.createElement('section');sec.className='lesson';
  sec.innerHTML=`<div><div class="eyebrow">Lesson ${i+1} of ${L.length} · notes §${L[i].s}</div><h2>${L[i].t}</h2></div>`;
  const body=document.createElement('div');body.style.display='flex';body.style.flexDirection='column';body.style.gap='16px';sec.appendChild(body);m.appendChild(sec);
  L[i].build.call(L[i],body);
  const nr=document.createElement('div');nr.className='navrow';
  nr.innerHTML=`<button type="button" id="prev" ${i?'':'hidden'}>← ${i?L[i-1].t:''}</button><span class="score" id="score"></span><button type="button" class="next" id="next" ${i<L.length-1?'':'hidden'}>${i<L.length-1?L[i+1].t+' →':''}</button>`;
  sec.appendChild(nr);$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);updScore();
  try{localStorage.setItem('ch7lab',i)}catch(e){}
}
function go(i){location.hash='lesson'+(i+1);}
function fromHash(){const m=/lesson(\d)/.exec(location.hash);let i=m?+m[1]-1:0;if(!m){try{i=+(localStorage.getItem('ch7lab')||0)}catch(e){}}show(Math.min(Math.max(i,0),L.length-1));window.scrollTo({top:0});}
L.forEach((l,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span class="n">${i+1}</span><span>${l.t}</span>`;b.onclick=()=>go(i);$('#nav').appendChild(b);});
window.addEventListener('hashchange',fromHash);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>L[cur].draw&&L[cur].draw(),120);});
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>L[cur].draw&&L[cur].draw());
new MutationObserver(()=>L[cur].draw&&L[cur].draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts&&document.fonts.ready.then(()=>L[cur].draw&&L[cur].draw());
fromHash();
</script>
